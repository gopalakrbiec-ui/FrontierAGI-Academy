<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1100" height="640" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">An LLM gateway, block by block</text><text x="24" y="56" font-size="13" fill="#475569">One request: check the key, clean the prompt, try the cache, route, retry, check the answer, log it. Reference design.</text><rect x="20" y="80" width="170" height="330" rx="12" fill="#4755690d" stroke="#475569" stroke-width="1.2"/><text x="32" y="100" font-size="12" font-weight="800" fill="#475569" letter-spacing=".5">CLIENT APPS</text><rect x="36" y="112" width="138" height="60" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="105.0" y="147.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Chatbot</text><rect x="36" y="204" width="138" height="60" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="105.0" y="239.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Internal tools</text><rect x="36" y="296" width="138" height="60" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="105.0" y="331.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">AI agents</text><rect x="215" y="80" width="600" height="420" rx="12" fill="#0f766e0d" stroke="#0f766e" stroke-width="1.2"/><text x="227" y="100" font-size="12" font-weight="800" fill="#0f766e" letter-spacing=".5">REQUEST PATH (THE GATEWAY)</text><rect x="240" y="110" width="250" height="64" rx="10" fill="#0f766e14" stroke="#0f766e" stroke-width="1.6"/><text x="365.0" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">① Auth &amp; rate limits</text><text x="365.0" y="152" text-anchor="middle" font-size="12" fill="#334155">virtual keys · team budgets</text><rect x="540" y="110" width="250" height="64" rx="10" fill="#33415514" stroke="#334155" stroke-width="1.6"/><text x="665.0" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Key &amp; budget store</text><text x="665.0" y="152" text-anchor="middle" font-size="12" fill="#334155">keys · limits · spend</text><rect x="240" y="215" width="250" height="64" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="365.0" y="237" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">③ Input guardrails</text><text x="365.0" y="257" text-anchor="middle" font-size="12" fill="#334155">mask PII · safety check</text><rect x="540" y="215" width="250" height="64" rx="10" fill="#be123c14" stroke="#be123c" stroke-width="1.6"/><text x="665.0" y="237" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">④ Semantic cache</text><text x="665.0" y="257" text-anchor="middle" font-size="12" fill="#334155">similar prompt → stored answer</text><rect x="540" y="320" width="250" height="64" rx="10" fill="#0369a114" stroke="#0369a1" stroke-width="1.6"/><text x="665.0" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">⑤ Model router</text><text x="665.0" y="362" text-anchor="middle" font-size="12" fill="#334155">cheapest model that passes</text><rect x="240" y="420" width="250" height="64" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="365.0" y="442" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">⑧ Output guardrails</text><text x="365.0" y="462" text-anchor="middle" font-size="12" fill="#334155">safety check · unmask PII</text><rect x="840" y="80" width="240" height="420" rx="12" fill="#d977060d" stroke="#d97706" stroke-width="1.2"/><text x="852" y="100" font-size="12" font-weight="800" fill="#d97706" letter-spacing=".5">MODEL POOL</text><rect x="860" y="110" width="200" height="64" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="960.0" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">⑥⑦ Fallback &amp; retry</text><text x="960.0" y="152" text-anchor="middle" font-size="12" fill="#334155">429 · timeout → next model</text><rect x="870" y="200" width="180" height="50" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="960.0" y="230.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Hosted model A</text><rect x="870" y="268" width="180" height="50" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="960.0" y="298.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Hosted model B</text><rect x="870" y="336" width="180" height="50" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="960.0" y="366.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Cloud model service</text><rect x="870" y="404" width="180" height="50" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="960.0" y="434.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Self-hosted (vLLM)</text><line x1="174" y1="142" x2="238" y2="142" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="490" y1="142" x2="538" y2="142" stroke="#334155" stroke-width="1.7" marker-end="url(#a)" marker-start="url(#a)"/><line x1="365" y1="174" x2="365" y2="213" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="490" y1="247" x2="538" y2="247" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="540" y1="265" x2="180" y2="300" stroke="#334155" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="264.8" y="288" width="130.39999999999998" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="330" y="300" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">cache hit → answer</text><line x1="665" y1="279" x2="665" y2="318" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="672.4" y="290" width="35.2" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="690" y="302" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">miss</text><line x1="790" y1="352" x2="858" y2="160" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="960" y1="174" x2="960" y2="198" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="860" y1="452" x2="492" y2="452" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="628.4" y="434" width="103.2" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="680" y="446" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">raw completion</text><line x1="240" y1="452" x2="176" y2="380" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="141.6" y="418" width="116.8" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="200" y="430" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">validated answer</text><rect x="215" y="520" width="600" height="100" rx="12" fill="#4755690d" stroke="#475569" stroke-width="1.2"/><text x="227" y="540" font-size="12" font-weight="800" fill="#475569" letter-spacing=".5">OBSERVABILITY</text><rect x="240" y="548" width="170" height="54" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="325.0" y="570" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Traces</text><text x="325.0" y="590" text-anchor="middle" font-size="12" fill="#334155">model · tokens · latency</text><rect x="425" y="548" width="170" height="54" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="510.0" y="570" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Spend logs</text><text x="510.0" y="590" text-anchor="middle" font-size="12" fill="#334155">per key and team</text><rect x="610" y="548" width="180" height="54" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="700.0" y="570" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Quality evals</text><text x="700.0" y="590" text-anchor="middle" font-size="12" fill="#334155">scores on traces</text><rect x="860" y="548" width="200" height="54" rx="10" fill="#0369a114" stroke="#0369a1" stroke-width="1.6"/><text x="960.0" y="570" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Router tuning</text><text x="960.0" y="590" text-anchor="middle" font-size="12" fill="#334155">cost + quality → rules</text><line x1="365" y1="486" x2="365" y2="546" stroke="#334155" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><line x1="790" y1="575" x2="858" y2="575" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="960" y1="546" x2="800" y2="384" stroke="#334155" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="856.8" y="508" width="96.39999999999999" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="905" y="520" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">updated rules</text></svg>