<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1000" height="360" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Harness, LLM gateway and MCP gateway</text><text x="24" y="56" font-size="13" fill="#475569">The harness runs the task; each gateway guards one kind of traffic.</text><rect x="30" y="140" width="230" height="96" rx="10" fill="#0f766e14" stroke="#0f766e" stroke-width="1.6"/><text x="145.0" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Agent harness</text><text x="145.0" y="182" text-anchor="middle" font-size="12" fill="#334155">loop · context · tools</text><text x="145.0" y="198" text-anchor="middle" font-size="12" fill="#334155">approvals · one task</text><rect x="390" y="80" width="240" height="84" rx="10" fill="#0369a114" stroke="#0369a1" stroke-width="1.6"/><text x="510.0" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">LLM gateway</text><text x="510.0" y="122" text-anchor="middle" font-size="12" fill="#334155">keys · budgets · cache</text><text x="510.0" y="138" text-anchor="middle" font-size="12" fill="#334155">routing · fallback · logs</text><rect x="390" y="230" width="240" height="84" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="510.0" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">MCP gateway</text><text x="510.0" y="272" text-anchor="middle" font-size="12" fill="#334155">which tool · read vs write</text><text x="510.0" y="288" text-anchor="middle" font-size="12" fill="#334155">credentials · audit</text><rect x="740" y="80" width="230" height="84" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="855.0" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Models</text><text x="855.0" y="122" text-anchor="middle" font-size="12" fill="#334155">hosted and self-hosted</text><rect x="740" y="230" width="230" height="84" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="855.0" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Tools and systems</text><text x="855.0" y="272" text-anchor="middle" font-size="12" fill="#334155">code host · chat · DB · CRM</text><line x1="260" y1="170" x2="388" y2="122" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="278.6" y="123" width="82.8" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="320" y="135" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">model calls</text><line x1="260" y1="208" x2="388" y2="272" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="282.0" y="243" width="76.0" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="320" y="255" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">tool calls</text><line x1="630" y1="122" x2="738" y2="122" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="630" y1="272" x2="738" y2="272" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><text x="390" y="345" font-size="13" fill="#475569" text-anchor="start" font-weight="700">Protects budget and data from the models  ·  protects your systems from the agent</text></svg>