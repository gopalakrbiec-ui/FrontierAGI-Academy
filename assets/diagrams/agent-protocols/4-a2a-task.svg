<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="450" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">An A2A task’s life</text><text x="24" y="56" font-size="13" fill="#475569">States from the A2A 1.0 specification; arrows are the usual paths</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="40" y="180" width="180" height="50" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="130.0" y="210.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">submitted</text><rect x="260" y="180" width="180" height="50" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="350.0" y="210.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">working</text><rect x="500" y="80" width="200" height="50" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="600.0" y="110.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">input-required</text><rect x="500" y="290" width="200" height="50" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="600.0" y="320.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">auth-required</text><rect x="800" y="60" width="180" height="50" rx="10" fill="#15803d14" stroke="#15803d" stroke-width="1.6"/><text x="890.0" y="90.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">completed</text><rect x="800" y="150" width="180" height="50" rx="10" fill="#be123c14" stroke="#be123c" stroke-width="1.6"/><text x="890.0" y="180.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">failed</text><rect x="800" y="240" width="180" height="50" rx="10" fill="#be123c14" stroke="#be123c" stroke-width="1.6"/><text x="890.0" y="270.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">canceled</text><rect x="800" y="330" width="180" height="50" rx="10" fill="#be123c14" stroke="#be123c" stroke-width="1.6"/><text x="890.0" y="360.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">rejected</text><line x1="220" y1="205" x2="258" y2="205" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="440" y1="195" x2="498" y2="110" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="498" y1="120" x2="442" y2="200" stroke="#d97706" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><line x1="440" y1="218" x2="498" y2="310" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="498" y1="300" x2="442" y2="222" stroke="#d97706" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><line x1="440" y1="205" x2="798" y2="85" stroke="#94a3b8" stroke-width="1.7" marker-end="url(#a)"/><line x1="440" y1="205" x2="798" y2="175" stroke="#94a3b8" stroke-width="1.7" marker-end="url(#a)"/><line x1="440" y1="205" x2="798" y2="265" stroke="#94a3b8" stroke-width="1.7" marker-end="url(#a)"/><line x1="440" y1="205" x2="798" y2="355" stroke="#94a3b8" stroke-width="1.7" marker-end="url(#a)"/><path d="M130,232 C130,400 600,400 796,362" fill="none" stroke="#94a3b8" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="420" y="392" font-size="11.5" fill="#64748b" text-anchor="middle">refused at the start</text><text x="1000" y="90" font-size="13" fill="#15803d" text-anchor="start" font-weight="700">terminal</text><text x="1000" y="110" font-size="12" fill="#475569" text-anchor="start">no more messages</text><text x="1000" y="270" font-size="13" fill="#be123c" text-anchor="start" font-weight="700">terminal</text><text x="1000" y="290" font-size="12" fill="#475569" text-anchor="start">start a new task</text><text x="620" y="150" font-size="12" fill="#b45309" text-anchor="middle">interrupted: the client sends</text><text x="620" y="166" font-size="12" fill="#b45309" text-anchor="middle">more input or credentials</text><text x="24" y="436" font-size="11.5" fill="#64748b" text-anchor="start">Source: A2A specification 1.0 (TASK_STATE_*). Updates arrive by polling, a stream (SSE / gRPC) or push notifications to a webhook.</text></svg>