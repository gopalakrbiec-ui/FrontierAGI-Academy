<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="520" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">One agent purchase, every protocol</text><text x="24" y="56" font-size="13" fill="#475569">Our worked example: “reorder printer ink under $60”</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="fd" style="animation-delay:0.0s"><circle cx="50" cy="104" r="18" fill="#2563eb"/><text x="50" y="109" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">1</text><rect x="84" y="80" width="760" height="48" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="464.0" y="109.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Read past orders and preferences</text><rect x="870" y="80" width="300" height="48" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><text x="1020.0" y="109.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">MCP</text></g><g class="fd" style="animation-delay:0.15s"><circle cx="50" cy="174" r="18" fill="#0d9488"/><text x="50" y="179" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">2</text><rect x="84" y="150" width="760" height="48" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="464.0" y="179.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Ask the office-supplies merchant’s agent for stock</text><rect x="870" y="150" width="300" height="48" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.6"/><text x="1020.0" y="179.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">A2A</text></g><g class="fd" style="animation-delay:0.3s"><circle cx="50" cy="244" r="18" fill="#d97706"/><text x="50" y="249" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">3</text><rect x="84" y="220" width="760" height="48" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="464.0" y="249.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Create and update a checkout session</text><rect x="870" y="220" width="300" height="48" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/><text x="1020.0" y="249.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">ACP or UCP</text></g><g class="fd" style="animation-delay:0.44999999999999996s"><circle cx="50" cy="314" r="18" fill="#be123c"/><text x="50" y="319" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">4</text><rect x="84" y="290" width="760" height="48" rx="10" fill="#be123c14" stroke="#be123c" stroke-width="1.6"/><text x="464.0" y="319.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Attach the user’s signed mandate (≤ $60, ink only)</text><rect x="870" y="290" width="300" height="48" rx="10" fill="#ffffff" stroke="#be123c" stroke-width="1.6"/><text x="1020.0" y="319.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">AP2</text></g><g class="fd" style="animation-delay:0.6s"><circle cx="50" cy="384" r="18" fill="#be123c"/><text x="50" y="389" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">5</text><rect x="84" y="360" width="760" height="48" rx="10" fill="#be123c14" stroke="#be123c" stroke-width="1.6"/><text x="464.0" y="389.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Pay through card rails or stablecoin</text><rect x="870" y="360" width="300" height="48" rx="10" fill="#ffffff" stroke="#be123c" stroke-width="1.6"/><text x="1020.0" y="389.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">PSP or x402</text></g><g class="fd" style="animation-delay:0.75s"><circle cx="50" cy="454" r="18" fill="#d97706"/><text x="50" y="459" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">6</text><rect x="84" y="430" width="760" height="48" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="464.0" y="459.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Order webhook → tell the user</text><rect x="870" y="430" width="300" height="48" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/><text x="1020.0" y="459.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">ACP / UCP</text></g><text x="24" y="506" font-size="11.5" fill="#64748b" text-anchor="start">Illustrative. Real deployments often use only one or two of these; see Part 4 for who supports what.</text></svg>