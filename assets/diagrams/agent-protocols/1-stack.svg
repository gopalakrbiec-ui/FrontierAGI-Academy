<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="560" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">The agent protocol stack, late 2026</text><text x="24" y="56" font-size="13" fill="#475569">Which protocol carries which conversation (our grouping of the published specs)</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="fd" style="animation-delay:0.0s"><rect x="24" y="80" width="1152" height="80" rx="12" fill="#be123c12" stroke="#be123c" stroke-width="1.6"/><text x="44" y="110" font-size="17" fill="#be123c" text-anchor="start" font-weight="700">Payments</text><text x="44" y="134" font-size="13" fill="#334155" text-anchor="start">prove the user allowed this payment; move the money</text><text x="1156" y="124" font-size="13.5" fill="#0f172a" text-anchor="end" font-weight="700">AP2 (mandates) · x402 (HTTP 402 payments) · card networks’ agent tokens ⚠️</text></g><g class="fd" style="animation-delay:0.15s"><rect x="24" y="172" width="1152" height="80" rx="12" fill="#d9770612" stroke="#d97706" stroke-width="1.6"/><text x="44" y="202" font-size="17" fill="#d97706" text-anchor="start" font-weight="700">Commerce</text><text x="44" y="226" font-size="13" fill="#334155" text-anchor="start">browse, build a cart, check out with a merchant</text><text x="1156" y="216" font-size="13.5" fill="#0f172a" text-anchor="end" font-weight="700">ACP (OpenAI + Stripe) · UCP (Google and partners)</text></g><g class="fd" style="animation-delay:0.3s"><rect x="24" y="264" width="1152" height="80" rx="12" fill="#0d948812" stroke="#0d9488" stroke-width="1.6"/><text x="44" y="294" font-size="17" fill="#0d9488" text-anchor="start" font-weight="700">Agent ↔ agent</text><text x="44" y="318" font-size="13" fill="#334155" text-anchor="start">hand a task to another team’s or company’s agent</text><text x="1156" y="308" font-size="13.5" fill="#0f172a" text-anchor="end" font-weight="700">A2A (Linux Foundation, from Google)</text></g><g class="fd" style="animation-delay:0.44999999999999996s"><rect x="24" y="356" width="1152" height="80" rx="12" fill="#2563eb12" stroke="#2563eb" stroke-width="1.6"/><text x="44" y="386" font-size="17" fill="#2563eb" text-anchor="start" font-weight="700">Agent ↔ tools and data</text><text x="44" y="410" font-size="13" fill="#334155" text-anchor="start">call tools, read resources, use prompts</text><text x="1156" y="400" font-size="13.5" fill="#0f172a" text-anchor="end" font-weight="700">MCP (Agentic AI Foundation, from Anthropic)</text></g><g class="fd" style="animation-delay:0.6s"><rect x="24" y="448" width="1152" height="80" rx="12" fill="#7c3aed12" stroke="#7c3aed" stroke-width="1.6"/><text x="44" y="478" font-size="17" fill="#7c3aed" text-anchor="start" font-weight="700">Identity and auth (under all of them)</text><text x="44" y="502" font-size="13" fill="#334155" text-anchor="start">who is calling, on whose behalf, with what rights</text><text x="1156" y="492" font-size="13.5" fill="#0f172a" text-anchor="end" font-weight="700">OAuth 2.1 / OpenID Connect, signed requests, verifiable credentials</text></g><text x="24" y="546" font-size="11.5" fill="#64748b" text-anchor="start">Each layer can run without the ones above it. AP2 runs as an extension of A2A and UCP; ACP added MCP support in 2026-04-17.</text></svg>