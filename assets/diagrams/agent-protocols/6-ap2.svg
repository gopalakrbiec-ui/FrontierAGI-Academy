<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="470" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">AP2: proving the user said yes</text><text x="24" y="56" font-size="13" fill="#475569">Signed “mandates” travel with the purchase (AP2 v0.2); who sees what</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="40" y="80" width="170" height="60" rx="10" fill="#0f172a14" stroke="#0f172a" stroke-width="1.6"/><text x="125.0" y="102" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">User</text><text x="125.0" y="122" text-anchor="middle" font-size="12" fill="#334155">on a trusted surface</text><rect x="280" y="80" width="170" height="60" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="365.0" y="102" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Shopping agent</text><text x="365.0" y="122" text-anchor="middle" font-size="12" fill="#334155">builds cart</text><rect x="520" y="80" width="170" height="60" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="605.0" y="102" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Merchant</text><text x="605.0" y="122" text-anchor="middle" font-size="12" fill="#334155">checkout</text><rect x="760" y="80" width="170" height="60" rx="10" fill="#be123c14" stroke="#be123c" stroke-width="1.6"/><text x="845.0" y="102" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Credential provider</text><text x="845.0" y="122" text-anchor="middle" font-size="12" fill="#334155">wallet / issuer</text><rect x="1000" y="80" width="170" height="60" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="1085.0" y="102" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Payment processor</text><text x="1085.0" y="122" text-anchor="middle" font-size="12" fill="#334155">merchant’s PSP</text><line x1="125" y1="142" x2="365" y2="210" stroke="#7c3aed" stroke-width="1.7" marker-end="url(#a)"/><rect x="161.4" y="184" width="137.2" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="230" y="196" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">signs open mandates</text><rect x="250" y="214" width="260" height="64" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="380.0" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Open mandates</text><text x="380.0" y="256" text-anchor="middle" font-size="12" fill="#334155">limits: budget, items, merchant, expiry</text><line x1="380" y1="280" x2="600" y2="330" stroke="#7c3aed" stroke-width="1.7" marker-end="url(#a)"/><rect x="470" y="330" width="300" height="64" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="620.0" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Closed checkout mandate</text><text x="620.0" y="372" text-anchor="middle" font-size="12" fill="#334155">exact cart → merchant</text><line x1="620" y1="330" x2="605" y2="142" stroke="#d97706" stroke-width="1.7" marker-end="url(#a)"/><line x1="510" y1="262" x2="860" y2="330" stroke="#7c3aed" stroke-width="1.7" marker-end="url(#a)"/><rect x="800" y="330" width="300" height="64" rx="10" fill="#be123c14" stroke="#be123c" stroke-width="1.6"/><text x="950.0" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Closed payment mandate</text><text x="950.0" y="372" text-anchor="middle" font-size="12" fill="#334155">exact amount → provider, network, PSP</text><line x1="950" y1="330" x2="845" y2="142" stroke="#be123c" stroke-width="1.7" marker-end="url(#a)"/><line x1="950" y1="330" x2="1085" y2="142" stroke="#be123c" stroke-width="1.7" marker-end="url(#a)"/><text x="24" y="440" font-size="12.5" fill="#334155" text-anchor="start" font-weight="700">Human present: the user signs the closed mandates. Human not present: the agent signs them, inside the limits of the user-signed open mandates.</text><text x="24" y="458" font-size="11.5" fill="#64748b" text-anchor="start">Source: AP2 specification v0.2 (roles, mandates, modes). Standardisation continues in FIDO Alliance working groups.</text></svg>