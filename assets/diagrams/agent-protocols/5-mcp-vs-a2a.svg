<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="430" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">MCP is vertical, A2A is horizontal</text><text x="24" y="56" font-size="13" fill="#475569">The A2A project’s own framing: MCP gives one agent depth; A2A gives a system reach</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="470" y="60" width="260" height="70" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="600.0" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Support agent</text><text x="600.0" y="102" text-anchor="middle" font-size="12" fill="#334155">your company</text><rect x="70" y="300" width="124" height="50" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="132.0" y="330.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">CRM tool</text><line x1="600" y1="132" x2="132" y2="298" stroke="#2563eb" stroke-width="1.7" marker-end="url(#a)"/><rect x="351.8" y="197.0" width="28.4" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="366.0" y="209.0" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">MCP</text><rect x="210" y="300" width="124" height="50" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="272.0" y="330.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Refund API</text><line x1="600" y1="132" x2="272" y2="298" stroke="#2563eb" stroke-width="1.7" marker-end="url(#a)"/><rect x="350" y="300" width="124" height="50" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="412.0" y="330.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Policy docs</text><line x1="600" y1="132" x2="412" y2="298" stroke="#2563eb" stroke-width="1.7" marker-end="url(#a)"/><rect x="490" y="300" width="124" height="50" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="552.0" y="330.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Ticket system</text><line x1="600" y1="132" x2="552" y2="298" stroke="#2563eb" stroke-width="1.7" marker-end="url(#a)"/><rect x="880" y="180" width="280" height="60" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="6 4"/><text x="1020.0" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Carrier’s shipping agent</text><text x="1020.0" y="222" text-anchor="middle" font-size="12" fill="#334155">another company, opaque</text><line x1="732" y1="100" x2="878" y2="210" stroke="#0d9488" stroke-width="1.7" marker-end="url(#a)"/><rect x="790.8" y="137.0" width="28.4" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="805.0" y="149.0" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">A2A</text><rect x="880" y="290" width="280" height="60" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="6 4"/><text x="1020.0" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Bank’s fraud agent</text><text x="1020.0" y="332" text-anchor="middle" font-size="12" fill="#334155">another company, opaque</text><line x1="732" y1="100" x2="878" y2="320" stroke="#0d9488" stroke-width="1.7" marker-end="url(#a)"/><text x="24" y="416" font-size="11.5" fill="#64748b" text-anchor="start">Our example. Tools are called with arguments; remote agents are given tasks and may ask questions back, stream progress or take days.</text></svg>