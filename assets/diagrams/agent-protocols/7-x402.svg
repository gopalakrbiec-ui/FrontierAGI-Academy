<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="400" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">x402: paying for an API call with HTTP 402</text><text x="24" y="56" font-size="13" fill="#475569">The x402 README’s flow, shortened</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="60" y="70" width="200" height="50" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="160.0" y="100.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Agent (client)</text><line x1="160" y1="122" x2="160" y2="372" stroke="#0d9488" stroke-dasharray="4 4"/><rect x="520" y="70" width="200" height="50" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="620.0" y="100.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Resource server</text><line x1="620" y1="122" x2="620" y2="372" stroke="#d97706" stroke-dasharray="4 4"/><rect x="960" y="70" width="200" height="50" rx="10" fill="#be123c14" stroke="#be123c" stroke-width="1.6"/><text x="1060.0" y="100.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Facilitator</text><line x1="1060" y1="122" x2="1060" y2="372" stroke="#be123c" stroke-dasharray="4 4"/><g class="fd" style="animation-delay:0.0s"><line x1="160" y1="150" x2="620" y2="150" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="355.4" y="133" width="69.19999999999999" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="390.0" y="145" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">GET /data</text></g><g class="fd" style="animation-delay:0.15s"><line x1="620" y1="188" x2="160" y2="188" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="311.2" y="171" width="157.6" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="390.0" y="183" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">402 + PAYMENT-REQUIRED</text></g><g class="fd" style="animation-delay:0.3s"><line x1="160" y1="226" x2="620" y2="226" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="301.0" y="209" width="178.0" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="390.0" y="221" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">retry + PAYMENT-SIGNATURE</text></g><g class="fd" style="animation-delay:0.44999999999999996s"><line x1="620" y1="264" x2="1060" y2="264" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="764.6" y="247" width="150.79999999999998" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="840.0" y="259" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">/verify, then /settle</text></g><g class="fd" style="animation-delay:0.6s"><line x1="1060" y1="302" x2="620" y2="302" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="812.2" y="285" width="55.6" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="840.0" y="297" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">settled</text></g><g class="fd" style="animation-delay:0.75s"><line x1="620" y1="340" x2="160" y2="340" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="277.2" y="323" width="225.6" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="390.0" y="335" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">200 OK + data + PAYMENT-RESPONSE</text></g><text x="24" y="390" font-size="11.5" fill="#64748b" text-anchor="start">Source: x402 README (x402 Foundation; started at Coinbase). Built for machine-to-machine payments, mainly stablecoins today.</text></svg>