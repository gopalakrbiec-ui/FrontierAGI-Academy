<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="470" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">MCP becomes stateless (revision 2026-07-28)</text><text x="24" y="56" font-size="13" fill="#475569">Before: a session opened with a handshake. After: every request carries its own version and capabilities</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="24" y="76" width="560" height="360" rx="12" fill="#64748b0d" stroke="#64748b" stroke-width="1.2"/><text x="36" y="96" font-size="12" font-weight="800" fill="#64748b" letter-spacing=".5">UP TO 2025-11-25</text><rect x="616" y="76" width="560" height="360" rx="12" fill="#2563eb0d" stroke="#2563eb" stroke-width="1.2"/><text x="628" y="96" font-size="12" font-weight="800" fill="#2563eb" letter-spacing=".5">FROM 2026-07-28</text><g class="fd" style="animation-delay:0.0s"><rect x="48" y="108" width="512" height="42" rx="10" fill="#64748b14" stroke="#64748b" stroke-width="1.6"/><text x="304.0" y="134.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">initialize  →  capabilities agreed</text></g><g class="fd" style="animation-delay:0.1s"><rect x="48" y="160" width="512" height="42" rx="10" fill="#64748b14" stroke="#64748b" stroke-width="1.6"/><text x="304.0" y="186.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">notifications/initialized</text></g><g class="fd" style="animation-delay:0.2s"><rect x="48" y="212" width="512" height="42" rx="10" fill="#64748b14" stroke="#64748b" stroke-width="1.6"/><text x="304.0" y="238.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Mcp-Session-Id header on every call</text></g><g class="fd" style="animation-delay:0.30000000000000004s"><rect x="48" y="264" width="512" height="42" rx="10" fill="#64748b14" stroke="#64748b" stroke-width="1.6"/><text x="304.0" y="290.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">tools/list (could differ per session)</text></g><g class="fd" style="animation-delay:0.4s"><rect x="48" y="316" width="512" height="42" rx="10" fill="#64748b14" stroke="#64748b" stroke-width="1.6"/><text x="304.0" y="342.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">tools/call …</text></g><g class="fd" style="animation-delay:0.5s"><rect x="48" y="368" width="512" height="42" rx="10" fill="#64748b14" stroke="#64748b" stroke-width="1.6"/><text x="304.0" y="394.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">server → client: sampling / elicitation</text></g><g class="fd" style="animation-delay:0.6s"><rect x="640" y="108" width="512" height="42" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="896.0" y="134.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">(optional) server/discover</text></g><g class="fd" style="animation-delay:0.7s"><rect x="640" y="160" width="512" height="42" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="896.0" y="186.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">tools/call with _meta: version + capabilities</text></g><g class="fd" style="animation-delay:0.8s"><rect x="640" y="212" width="512" height="42" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="896.0" y="238.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">no session id; any server replica can answer</text></g><g class="fd" style="animation-delay:0.9s"><rect x="640" y="264" width="512" height="42" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="896.0" y="290.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">tools/list same for everyone, cacheable (ttlMs)</text></g><g class="fd" style="animation-delay:1.0s"><rect x="640" y="316" width="512" height="42" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="896.0" y="342.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">needs input? result “input_required”</text></g><g class="fd" style="animation-delay:1.1s"><rect x="640" y="368" width="512" height="42" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="896.0" y="394.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">client retries with inputResponses</text></g><text x="24" y="456" font-size="11.5" fill="#64748b" text-anchor="start">Source: MCP specification 2026-07-28, “Key Changes” (SEP-2567, SEP-2575, SEP-2322). Why it matters: plain load balancers and caches now work.</text></svg>