<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="400" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Agent PRs land less often than other PRs</text><text x="24" y="56" font-size="13" fill="#475569">LinearB “PR yield rate”: share of opened PRs that merge, by organisation tier (2026 benchmarks)</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><text x="24" y="130" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">Elite (top 10%)</text><rect class="gr" x="240" y="100" width="720" height="26" rx="6" fill="#64748b"/><text x="970" y="119" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">90% all PRs</text><rect class="gr" style="animation-delay:.3s" x="240" y="132" width="632" height="26" rx="6" fill="#be123c"/><text x="882" y="151" font-size="13" fill="#be123c" text-anchor="start" font-weight="700">79% agentic PRs</text><text x="24" y="220" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">Good (top 30%)</text><rect class="gr" x="240" y="190" width="688" height="26" rx="6" fill="#64748b"/><text x="938" y="209" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">86% all PRs</text><rect class="gr" style="animation-delay:.3s" x="240" y="222" width="464" height="26" rx="6" fill="#be123c"/><text x="714" y="241" font-size="13" fill="#be123c" text-anchor="start" font-weight="700">58% agentic PRs</text><text x="24" y="310" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">Fair (top 60%)</text><rect class="gr" x="240" y="280" width="648" height="26" rx="6" fill="#64748b"/><text x="898" y="299" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">81% all PRs</text><rect class="gr" style="animation-delay:.3s" x="240" y="312" width="296" height="26" rx="6" fill="#be123c"/><text x="546" y="331" font-size="13" fill="#be123c" text-anchor="start" font-weight="700">37% agentic PRs</text><text x="24" y="384" font-size="11.5" fill="#64748b" text-anchor="start">Source: LinearB 2026 AI benchmarks, 2.7M PRs, 83,000 developers, 253 organisations, Feb–May 2026 (vendor first-party data) ⚠️.</text></svg>