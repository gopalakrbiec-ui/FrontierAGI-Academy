<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="380" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Where parallel agents run: the isolation ladder</text><text x="24" y="56" font-size="13" fill="#475569">Each rung buys more isolation and more agents at once, for more setup (our reading)</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="fd" style="animation-delay:0.0s"><rect x="40" y="260" width="250" height="92" rx="10" fill="#94a3b814" stroke="#94a3b8" stroke-width="1.6"/><text x="165.0" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Same folder</text><text x="165.0" y="302" text-anchor="middle" font-size="12" fill="#334155">one agent at a time</text><text x="165.0" y="318" text-anchor="middle" font-size="12" fill="#334155">limit: agents overwrite each other</text></g><line x1="290" y1="306" x2="325" y2="256" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.2s"><rect x="325" y="210" width="250" height="92" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="450.0" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Git worktrees</text><text x="450.0" y="252" text-anchor="middle" font-size="12" fill="#334155">a checkout per agent, one machine</text><text x="450.0" y="268" text-anchor="middle" font-size="12" fill="#334155">limit: ports, databases, caches collide</text></g><line x1="575" y1="256" x2="610" y2="206" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.4s"><rect x="610" y="160" width="250" height="92" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="735.0" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Containers</text><text x="735.0" y="202" text-anchor="middle" font-size="12" fill="#334155">own filesystem + services per agent</text><text x="735.0" y="218" text-anchor="middle" font-size="12" fill="#334155">limit: heavier, slower to start</text></g><line x1="860" y1="206" x2="895" y2="156" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.6000000000000001s"><rect x="895" y="110" width="250" height="92" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="1020.0" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Cloud dev boxes</text><text x="1020.0" y="152" text-anchor="middle" font-size="12" fill="#334155">pre-warmed VMs (Stripe: ~10 s)</text><text x="1020.0" y="168" text-anchor="middle" font-size="12" fill="#334155">limit: needs platform investment</text></g><text x="40" y="368" font-size="12" fill="#475569" text-anchor="start">Isolation also bounds damage: Stripe’s devboxes run in a QA environment with no production data and no open internet, so agents run without permission prompts.</text></svg>