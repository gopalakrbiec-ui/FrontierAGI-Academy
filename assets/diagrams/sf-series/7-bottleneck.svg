<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="420" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">The review bottleneck (illustrative)</text><text x="24" y="56" font-size="13" fill="#475569">Agents add PRs; one reviewer handles a fixed number a day. Past that line the queue grows every day</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><line x1="90" y1="360" x2="1130" y2="360" stroke="#334155"/><line x1="90" y1="360" x2="90" y2="100" stroke="#334155"/><polyline class="dr" points="90,360 142,347 194,334 246,321 298,308 350,295 402,282 454,269 506,256 558,243 610,230 662,217 714,204 766,191 818,178 870,165 922,152 974,139 1026,126 1078,113 1130,100" fill="none" stroke="#2563eb" stroke-width="3"/><polyline class="dr" points="90,360 142,347 194,334 246,321 298,308 350,295 402,282 454,269 506,256 558,256 610,256 662,256 714,256 766,256 818,256 870,256 922,256 974,256 1026,256 1078,256 1130,256" fill="none" stroke="#15803d" stroke-width="3"/><rect x="506.0" y="100" width="624.0" height="260" fill="#fee2e2" opacity=".5"/><text x="818.0" y="122" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="700">queue grows here</text><text x="1130" y="382" font-size="12" fill="#334155" text-anchor="end">agents per team →</text><text x="82" y="94" font-size="12" fill="#334155" text-anchor="start">PRs a day</text><text x="1120" y="130.0" font-size="13" fill="#2563eb" text-anchor="end" font-weight="700">PRs produced</text><text x="1120" y="248.0" font-size="13" fill="#15803d" text-anchor="end" font-weight="700">PRs merged (4 reviewers × 6 a day)</text><text x="24" y="404" font-size="11.5" fill="#64748b" text-anchor="start">Illustrative: 3 PRs per agent per day, 4 reviewers handling 6 each. Change the inputs in the calculator in this article.</text></svg>