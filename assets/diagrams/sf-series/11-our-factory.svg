<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="420" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">This site as a one-worker software factory</text><text x="24" y="56" font-size="13" fill="#475569">The same six stations, as they run for FrontierAGI Academy</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="fd" style="animation-delay:0.0s"><rect x="24" y="100" width="170" height="120" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="109.0" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Intake</text><text x="109.0" y="142" text-anchor="middle" font-size="12" fill="#334155">owner’s chat requests</text><text x="109.0" y="158" text-anchor="middle" font-size="12" fill="#334155">weekly data routine</text></g><line x1="194" y1="160" x2="218" y2="160" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.15s"><rect x="218" y="100" width="170" height="120" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="303.0" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Plan</text><text x="303.0" y="142" text-anchor="middle" font-size="12" fill="#334155">outline, sources, files to touch</text></g><line x1="388" y1="160" x2="412" y2="160" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.3s"><rect x="412" y="100" width="170" height="120" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="497.0" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Build</text><text x="497.0" y="142" text-anchor="middle" font-size="12" fill="#334155">one agent (Claude) writes</text><text x="497.0" y="158" text-anchor="middle" font-size="12" fill="#334155">pages, scripts, data</text></g><line x1="582" y1="160" x2="606" y2="160" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.44999999999999996s"><rect x="606" y="100" width="170" height="120" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="691.0" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Gates</text><text x="691.0" y="142" text-anchor="middle" font-size="12" fill="#334155">build.py --check: links, data,</text><text x="691.0" y="158" text-anchor="middle" font-size="12" fill="#334155">stale files · Playwright 1400/390</text><text x="691.0" y="174" text-anchor="middle" font-size="12" fill="#334155">· CI re-runs article code</text></g><line x1="776" y1="160" x2="800" y2="160" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.6s"><rect x="800" y="100" width="170" height="120" rx="10" fill="#be123c14" stroke="#be123c" stroke-width="1.6"/><text x="885.0" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Human gate</text><text x="885.0" y="142" text-anchor="middle" font-size="12" fill="#334155">owner reviews the live page</text><text x="885.0" y="158" text-anchor="middle" font-size="12" fill="#334155">and asks for changes</text></g><line x1="970" y1="160" x2="994" y2="160" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.75s"><rect x="994" y="100" width="170" height="120" rx="10" fill="#15803d14" stroke="#15803d" stroke-width="1.6"/><text x="1079.0" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Ship &amp; measure</text><text x="1079.0" y="142" text-anchor="middle" font-size="12" fill="#334155">push → GitHub Pages</text><text x="1079.0" y="158" text-anchor="middle" font-size="12" fill="#334155">feedback becomes the next request</text></g><path class="dr" d="M1110,222 C1110,320 90,320 90,222" fill="none" stroke="#15803d" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="600" y="340" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">339 commits are visible in this repository checkout (shallow history from 26 Oct 2026)</text><text x="600" y="362" font-size="12.5" fill="#b91c1c" text-anchor="middle">Missing next to a full factory: parallel workers, automatic intake, production metrics</text></svg>