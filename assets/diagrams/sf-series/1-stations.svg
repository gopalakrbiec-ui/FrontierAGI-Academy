<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="430" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">A software factory: six stations</text><text x="24" y="56" font-size="13" fill="#475569">The system around the coding agents. Each station has a job, an artefact it hands on and a typical failure (our framing)</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="fd" style="animation-delay:0.0s"><rect x="24" y="110" width="170" height="96" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="109.0" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">1. Intake</text><text x="109.0" y="152" text-anchor="middle" font-size="12" fill="#334155">tickets · bugs · alerts</text><text x="109.0" y="168" text-anchor="middle" font-size="12" fill="#334155">hand-off: a request</text></g><line x1="194" y1="158" x2="218" y2="158" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.18s"><rect x="218" y="110" width="170" height="96" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="303.0" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">2. Plan</text><text x="303.0" y="152" text-anchor="middle" font-size="12" fill="#334155">split · size · spec</text><text x="303.0" y="168" text-anchor="middle" font-size="12" fill="#334155">hand-off: a task + tests</text></g><line x1="388" y1="158" x2="412" y2="158" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.36s"><rect x="412" y="110" width="170" height="96" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="497.0" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">3. Parallel build</text><text x="497.0" y="152" text-anchor="middle" font-size="12" fill="#334155">many agents at once</text><text x="497.0" y="168" text-anchor="middle" font-size="12" fill="#334155">hand-off: a branch</text></g><line x1="582" y1="158" x2="606" y2="158" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.54s"><rect x="606" y="110" width="170" height="96" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="691.0" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">4. Gates</text><text x="691.0" y="152" text-anchor="middle" font-size="12" fill="#334155">lint · tests · evals · scans</text><text x="691.0" y="168" text-anchor="middle" font-size="12" fill="#334155">hand-off: a passing PR</text></g><line x1="776" y1="158" x2="800" y2="158" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.72s"><rect x="800" y="110" width="170" height="96" rx="10" fill="#be123c14" stroke="#be123c" stroke-width="1.6"/><text x="885.0" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">5. Human gate</text><text x="885.0" y="152" text-anchor="middle" font-size="12" fill="#334155">review · approve</text><text x="885.0" y="168" text-anchor="middle" font-size="12" fill="#334155">hand-off: a merge</text></g><line x1="970" y1="158" x2="994" y2="158" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.8999999999999999s"><rect x="994" y="110" width="170" height="96" rx="10" fill="#15803d14" stroke="#15803d" stroke-width="1.6"/><text x="1079.0" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">6. Ship &amp; measure</text><text x="1079.0" y="152" text-anchor="middle" font-size="12" fill="#334155">deploy · watch · learn</text><text x="1079.0" y="168" text-anchor="middle" font-size="12" fill="#334155">hand-off: new tickets</text></g><text x="109" y="230" font-size="11.5" fill="#b91c1c" text-anchor="middle" font-weight="700">fails when:</text><text x="109" y="246" font-size="11.5" fill="#b91c1c" text-anchor="middle">vague tickets</text><text x="303" y="230" font-size="11.5" fill="#b91c1c" text-anchor="middle" font-weight="700">fails when:</text><text x="303" y="246" font-size="11.5" fill="#b91c1c" text-anchor="middle">tasks too big</text><text x="497" y="230" font-size="11.5" fill="#b91c1c" text-anchor="middle" font-weight="700">fails when:</text><text x="497" y="246" font-size="11.5" fill="#b91c1c" text-anchor="middle">agents collide</text><text x="691" y="230" font-size="11.5" fill="#b91c1c" text-anchor="middle" font-weight="700">fails when:</text><text x="691" y="246" font-size="11.5" fill="#b91c1c" text-anchor="middle">weak tests pass bugs</text><text x="885" y="230" font-size="11.5" fill="#b91c1c" text-anchor="middle" font-weight="700">fails when:</text><text x="885" y="246" font-size="11.5" fill="#b91c1c" text-anchor="middle">reviews rubber-stamp</text><text x="1079" y="230" font-size="11.5" fill="#b91c1c" text-anchor="middle" font-weight="700">fails when:</text><text x="1079" y="246" font-size="11.5" fill="#b91c1c" text-anchor="middle">nobody measures escapes</text><path class="dr" d="M1110,250 C1110,360 90,360 90,250" fill="none" stroke="#15803d" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="600" y="378" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">Feedback loop: production results and escaped defects become the next tickets</text><text x="24" y="414" font-size="11.5" fill="#64748b" text-anchor="start">Our framing of the stations, after vendor descriptions (Factory.ai, Warp, TrueFoundry) and Stripe’s published Minions design.</text></svg>