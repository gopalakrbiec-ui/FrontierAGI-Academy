<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 474" width="1200" height="474" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="474" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Six “AI share of code” numbers that measure different things</text><text x="24" y="56" font-size="13" fill="#475569">Same question, different denominators: PRs started, lines merged, PRs assisted, PRs fully autonomous, company claims</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><text x="24" y="114" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">Agent-started PRs (GitHub, Sep 2026)</text><rect class="gr" style="animation-delay:0.0s" x="330" y="96" width="312.0" height="28" rx="6" fill="#2563eb"/><text x="650.0" y="116" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">40% of all PRs started with an agent draft</text><text x="24" y="168" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">AI-written merged lines (LinearB elite)</text><rect class="gr" style="animation-delay:0.15s" x="330" y="150" width="351.0" height="28" rx="6" fill="#7c3aed"/><text x="689.0" y="170" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">45% top 10% of 253 orgs</text><text x="24" y="222" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">PRs with AI help (LinearB elite)</text><rect class="gr" style="animation-delay:0.3s" x="330" y="204" width="421.2" height="28" rx="6" fill="#0d9488"/><text x="759.2" y="224" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">54% top 10% of orgs</text><text x="24" y="276" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">PRs by autonomous agents (LinearB elite)</text><rect class="gr" style="animation-delay:0.44999999999999996s" x="330" y="258" width="38.2" height="28" rx="6" fill="#be123c"/><text x="376.22" y="278" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">4.9% under 5%</text><text x="24" y="330" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">Google: new code AI-generated (claim)</text><rect class="gr" style="animation-delay:0.6s" x="330" y="312" width="585.0" height="28" rx="6" fill="#64748b"/><text x="923.0" y="332" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">75% ⚠️ CEO statement, Apr 2026</text><text x="24" y="384" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">Microsoft: code in repos by AI (claim)</text><rect class="gr" style="animation-delay:0.75s" x="330" y="366" width="195.0" height="28" rx="6" fill="#94a3b8"/><text x="533.0" y="386" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">25% ⚠️ 20–30%, 2025 statement</text><text x="24" y="458" font-size="11.5" fill="#64748b" text-anchor="start">Sources: GitHub Octoverse 2026; LinearB 2026 AI benchmarks (2.7M PRs, Feb–May 2026); company statements via press ⚠️. Bars are not comparable with each other.</text></svg>