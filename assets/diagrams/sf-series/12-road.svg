<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="380" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">From factory to autonomous software: what has to be solved</text><text x="24" y="56" font-size="13" fill="#475569">Our prediction of the order; dates are guesses</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="fd" style="animation-delay:0.0s"><rect x="30" y="90" width="260" height="100" rx="10" fill="#15803d14" stroke="#15803d" stroke-width="1.6"/><text x="160.0" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Today</text><text x="160.0" y="132" text-anchor="middle" font-size="12" fill="#334155">agents write, people approve every</text><text x="160.0" y="148" text-anchor="middle" font-size="12" fill="#334155">merge</text></g><line x1="290" y1="140" x2="320" y2="140" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.2s"><rect x="320" y="90" width="260" height="100" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="450.0" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Next</text><text x="450.0" y="132" text-anchor="middle" font-size="12" fill="#334155">agents also review low-risk changes;</text><text x="450.0" y="148" text-anchor="middle" font-size="12" fill="#334155">people approve by risk tier</text></g><line x1="580" y1="140" x2="610" y2="140" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.4s"><rect x="610" y="90" width="260" height="100" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="740.0" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Then</text><text x="740.0" y="132" text-anchor="middle" font-size="12" fill="#334155">agents deploy behind canaries and</text><text x="740.0" y="148" text-anchor="middle" font-size="12" fill="#334155">roll back on their own</text></g><line x1="870" y1="140" x2="900" y2="140" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.6000000000000001s"><rect x="900" y="90" width="260" height="100" rx="10" fill="#be123c14" stroke="#be123c" stroke-width="1.6"/><text x="1030.0" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Later</text><text x="1030.0" y="132" text-anchor="middle" font-size="12" fill="#334155">agents run on-call for their own</text><text x="1030.0" y="148" text-anchor="middle" font-size="12" fill="#334155">services; people set goals and limits</text></g><rect x="30" y="240" width="260" height="56" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4"/><text x="160.0" y="273.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Agent identity and accountability</text><rect x="320" y="240" width="260" height="56" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4"/><text x="450.0" y="273.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Prompt-injection-proof tools</text><rect x="610" y="240" width="260" height="56" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4"/><text x="740.0" y="273.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Long-run reliability</text><rect x="900" y="240" width="260" height="56" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4"/><text x="1030.0" y="273.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Checking work people cannot check</text><text x="600" y="330" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">Needed before each step can be trusted (dashed = open problems)</text></svg>