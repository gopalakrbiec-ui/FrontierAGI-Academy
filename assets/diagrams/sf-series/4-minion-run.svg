<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="470" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">One Stripe minion run, start to pull request</text><text x="24" y="56" font-size="13" fill="#475569">From Stripe’s Minions posts (Feb 2026). Rectangles = deterministic code; dashed = agent loop</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="fd" style="animation-delay:0.0s"><rect x="24" y="90" width="200" height="96" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="124.0" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Slack, CLI, web or ticket</text><text x="124.0" y="132" text-anchor="middle" font-size="12" fill="#334155">engineer or a flaky-test ticket</text></g><g class="fd" style="animation-delay:0.12s"><rect x="264" y="90" width="200" height="96" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="364.0" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Devbox ready in ~10 s</text><text x="364.0" y="132" text-anchor="middle" font-size="12" fill="#334155">pre-warmed EC2, QA env, no prod</text></g><g class="fd" style="animation-delay:0.24s"><rect x="504" y="90" width="200" height="96" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="604.0" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Hydrate context</text><text x="604.0" y="132" text-anchor="middle" font-size="12" fill="#334155">MCP tools on links in the thread</text><text x="604.0" y="148" text-anchor="middle" font-size="12" fill="#334155">scoped rule files</text></g><g class="fd" style="animation-delay:0.36s"><rect x="744" y="90" width="200" height="96" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="6 4"/><text x="844.0" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Implement task</text><text x="844.0" y="132" text-anchor="middle" font-size="12" fill="#334155">agent loop (forked goose)</text></g><g class="fd" style="animation-delay:0.48s"><rect x="984" y="90" width="200" height="96" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="1084.0" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Run linters</text><text x="1084.0" y="132" text-anchor="middle" font-size="12" fill="#334155">deterministic node, loop locally</text></g><g class="fd" style="animation-delay:0.6s"><rect x="984" y="250" width="200" height="96" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="1084.0" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Push → CI round 1</text><text x="1084.0" y="292" text-anchor="middle" font-size="12" fill="#334155">selected tests of 3M+</text><text x="1084.0" y="308" text-anchor="middle" font-size="12" fill="#334155">auto-apply autofixes</text></g><g class="fd" style="animation-delay:0.72s"><rect x="744" y="250" width="200" height="96" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="6 4"/><text x="844.0" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Fix CI failures</text><text x="844.0" y="292" text-anchor="middle" font-size="12" fill="#334155">agent loop, one more try</text></g><g class="fd" style="animation-delay:0.84s"><rect x="504" y="250" width="200" height="96" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="604.0" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Push → CI round 2</text><text x="604.0" y="292" text-anchor="middle" font-size="12" fill="#334155">then stop: max two rounds</text></g><g class="fd" style="animation-delay:0.96s"><rect x="264" y="250" width="200" height="96" rx="10" fill="#15803d14" stroke="#15803d" stroke-width="1.6"/><text x="364.0" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Pull request</text><text x="364.0" y="292" text-anchor="middle" font-size="12" fill="#334155">Stripe PR template</text></g><g class="fd" style="animation-delay:1.08s"><rect x="24" y="250" width="200" height="96" rx="10" fill="#be123c14" stroke="#be123c" stroke-width="1.6"/><text x="124.0" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Human review</text><text x="124.0" y="292" text-anchor="middle" font-size="12" fill="#334155">engineer reviews, asks a peer</text><text x="124.0" y="308" text-anchor="middle" font-size="12" fill="#334155">or sends new instructions</text></g><line x1="224" y1="138" x2="264" y2="138" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="464" y1="138" x2="504" y2="138" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="704" y1="138" x2="744" y2="138" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="944" y1="138" x2="984" y2="138" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="1084" y1="186" x2="1084" y2="250" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="984" y1="298" x2="944" y2="298" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="744" y1="298" x2="704" y2="298" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="504" y1="298" x2="464" y2="298" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="264" y1="298" x2="224" y2="298" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="24" y="380" width="560" height="60" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="304.0" y="402" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Toolshed: central MCP server, ~500 tools</text><text x="304.0" y="422" text-anchor="middle" font-size="12" fill="#334155">minions get a small curated subset; security controls block destructive calls</text><rect x="616" y="380" width="560" height="60" rx="10" fill="#15803d14" stroke="#15803d" stroke-width="1.6"/><text x="896.0" y="402" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Result: 1,300+ merged PRs a week</text><text x="896.0" y="422" text-anchor="middle" font-size="12" fill="#334155">fully minion-written, every one human-reviewed (Stripe, Part 2)</text></svg>