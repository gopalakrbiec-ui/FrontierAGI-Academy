<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="330" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">From “software factory” to agent factories</text><text x="24" y="56" font-size="13" fill="#475569">The idea is 55+ years old; the workers changed</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><line x1="40" y1="200" x2="1160" y2="200" stroke="#cbd5e1" stroke-width="4"/><g class="fd" style="animation-delay:0.0s"><circle cx="110.0" cy="200" r="8" fill="#64748b"/><line x1="110.0" y1="192" x2="110.0" y2="160" stroke="#64748b" stroke-width="1.4"/><text x="110.0" y="114" font-size="13" fill="#64748b" text-anchor="middle" font-weight="700">1969</text><text x="110.0" y="132" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">Hitachi software works</text><text x="110.0" y="150" font-size="11.5" fill="#475569" text-anchor="middle">Japan’s first “factory” for code</text></g><g class="fd" style="animation-delay:0.15s"><circle cx="217.8" cy="200" r="8" fill="#64748b"/><line x1="217.8" y1="208" x2="217.8" y2="230" stroke="#64748b" stroke-width="1.4"/><text x="217.8" y="250" font-size="13" fill="#64748b" text-anchor="middle" font-weight="700">1975–77</text><text x="217.8" y="268" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">SDC, Toshiba Fuchu</text><text x="217.8" y="286" font-size="11.5" fill="#475569" text-anchor="middle">standard tools + reuse</text></g><g class="fd" style="animation-delay:0.3s"><circle cx="335.4" cy="200" r="8" fill="#475569"/><line x1="335.4" y1="192" x2="335.4" y2="160" stroke="#475569" stroke-width="1.4"/><text x="335.4" y="114" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">2001</text><text x="335.4" y="132" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">Agile Manifesto</text><text x="335.4" y="150" font-size="11.5" fill="#475569" text-anchor="middle">small teams, short cycles</text></g><g class="fd" style="animation-delay:0.44999999999999996s"><circle cx="433.4" cy="200" r="8" fill="#475569"/><line x1="433.4" y1="208" x2="433.4" y2="230" stroke="#475569" stroke-width="1.4"/><text x="433.4" y="250" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">2009</text><text x="433.4" y="268" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">DevOps</text><text x="433.4" y="286" font-size="11.5" fill="#475569" text-anchor="middle">pipelines + automation</text></g><g class="fd" style="animation-delay:0.6s"><circle cx="551.0" cy="200" r="8" fill="#2563eb"/><line x1="551.0" y1="192" x2="551.0" y2="160" stroke="#2563eb" stroke-width="1.4"/><text x="551.0" y="114" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">2021</text><text x="551.0" y="132" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">Copilot preview</text><text x="551.0" y="150" font-size="11.5" fill="#475569" text-anchor="middle">AI autocompletes code</text></g><g class="fd" style="animation-delay:0.75s"><circle cx="658.8" cy="200" r="8" fill="#7c3aed"/><line x1="658.8" y1="208" x2="658.8" y2="230" stroke="#7c3aed" stroke-width="1.4"/><text x="658.8" y="250" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">Feb 2025</text><text x="658.8" y="268" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">Claude Code</text><text x="658.8" y="286" font-size="11.5" fill="#475569" text-anchor="middle">agent works a whole repo</text></g><g class="fd" style="animation-delay:0.8999999999999999s"><circle cx="766.6" cy="200" r="8" fill="#0d9488"/><line x1="766.6" y1="192" x2="766.6" y2="160" stroke="#0d9488" stroke-width="1.4"/><text x="766.6" y="114" font-size="13" fill="#0d9488" text-anchor="middle" font-weight="700">Oct 2025</text><text x="766.6" y="132" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">Parallel agents in IDEs</text><text x="766.6" y="150" font-size="11.5" fill="#475569" text-anchor="middle">worktrees, remote runners ⚠️</text></g><g class="fd" style="animation-delay:1.05s"><circle cx="874.4" cy="200" r="8" fill="#d97706"/><line x1="874.4" y1="208" x2="874.4" y2="230" stroke="#d97706" stroke-width="1.4"/><text x="874.4" y="250" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">Feb 2026</text><text x="874.4" y="268" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">Stripe Minions</text><text x="874.4" y="286" font-size="11.5" fill="#475569" text-anchor="middle">1,000+ agent PRs a week</text></g><g class="fd" style="animation-delay:1.2s"><circle cx="982.1999999999999" cy="200" r="8" fill="#be123c"/><line x1="982.1999999999999" y1="192" x2="982.1999999999999" y2="160" stroke="#be123c" stroke-width="1.4"/><text x="982.1999999999999" y="114" font-size="13" fill="#be123c" text-anchor="middle" font-weight="700">Jun–Aug 2026</text><text x="982.1999999999999" y="132" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">Factory platforms</text><text x="982.1999999999999" y="150" font-size="11.5" fill="#475569" text-anchor="middle">Factory.ai 2.0, Warp ⚠️</text></g><g class="fd" style="animation-delay:1.3499999999999999s"><circle cx="1099.8" cy="200" r="8" fill="#15803d"/><line x1="1099.8" y1="208" x2="1099.8" y2="230" stroke="#15803d" stroke-width="1.4"/><text x="1099.8" y="250" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">Sep 2026</text><text x="1099.8" y="268" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">40% of GitHub PRs</text><text x="1099.8" y="286" font-size="11.5" fill="#475569" text-anchor="middle">start with an agent</text></g><text x="24" y="318" font-size="11.5" fill="#64748b" text-anchor="start">Sources: Cusumano, “Japan’s Software Factories” (1991); Stripe engineering blog; GitHub Octoverse 2026; vendor announcements ⚠️.</text></svg>