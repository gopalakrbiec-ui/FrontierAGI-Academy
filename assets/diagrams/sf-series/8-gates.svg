<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="440" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">The gates: what each one catches</text><text x="24" y="56" font-size="13" fill="#475569">Cheap, fast checks first; slow, expensive checks last (“shift feedback left”)</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="fd" style="animation-delay:0.0s"><rect x="25.0" y="76" width="1150" height="42" rx="8" fill="#2563eb18" stroke="#2563eb"/><text x="600" y="94" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">Pre-push lint + format</text><text x="600" y="111" font-size="12" fill="#334155" text-anchor="middle">seconds · catches: style, obvious errors</text></g><g class="fd" style="animation-delay:0.12s"><rect x="60.0" y="126" width="1080" height="42" rx="8" fill="#7c3aed18" stroke="#7c3aed"/><text x="600" y="144" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">Type check + build</text><text x="600" y="161" font-size="12" fill="#334155" text-anchor="middle">seconds–minutes · catches: broken interfaces</text></g><g class="fd" style="animation-delay:0.24s"><rect x="95.0" y="176" width="1010" height="42" rx="8" fill="#0d948818" stroke="#0d9488"/><text x="600" y="194" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">Selected tests + autofixes</text><text x="600" y="211" font-size="12" fill="#334155" text-anchor="middle">minutes · catches: regressions in touched code</text></g><g class="fd" style="animation-delay:0.36s"><rect x="130.0" y="226" width="940" height="42" rx="8" fill="#d9770618" stroke="#d97706"/><text x="600" y="244" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">Security + dependency scans</text><text x="600" y="261" font-size="12" fill="#334155" text-anchor="middle">minutes · catches: secrets, known vulnerabilities</text></g><g class="fd" style="animation-delay:0.48s"><rect x="165.0" y="276" width="870" height="42" rx="8" fill="#c2410c18" stroke="#c2410c"/><text x="600" y="294" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">Evals for AI features</text><text x="600" y="311" font-size="12" fill="#334155" text-anchor="middle">minutes–hours · catches: quality drops in model behaviour</text></g><g class="fd" style="animation-delay:0.6s"><rect x="200.0" y="326" width="800" height="42" rx="8" fill="#47556918" stroke="#475569"/><text x="600" y="344" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">Cost + scope limits</text><text x="600" y="361" font-size="12" fill="#334155" text-anchor="middle">per run · catches: runaway tokens, oversized diffs</text></g><g class="fd" style="animation-delay:0.72s"><rect x="235.0" y="376" width="730" height="42" rx="8" fill="#be123c18" stroke="#be123c"/><text x="600" y="394" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">Human review</text><text x="600" y="411" font-size="12" fill="#334155" text-anchor="middle">hours · catches: wrong intent, risky design, taste</text></g><text x="24" y="428" font-size="11.5" fill="#64748b" text-anchor="start">Our reading of common practice; Stripe runs lint on every push in under a second, at most two CI rounds, then human review.</text></svg>