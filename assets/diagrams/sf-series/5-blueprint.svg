<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="360" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Workflow, agent, blueprint</text><text x="24" y="56" font-size="13" fill="#475569">Stripe’s “blueprint”: a workflow in code whose nodes are either plain code or an agent loop</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="24" y="80" width="360" height="250" rx="12" fill="#4755690d" stroke="#475569" stroke-width="1.2"/><text x="36" y="100" font-size="12" font-weight="800" fill="#475569" letter-spacing=".5">WORKFLOW: FIXED GRAPH</text><rect x="420" y="80" width="360" height="250" rx="12" fill="#0d94880d" stroke="#0d9488" stroke-width="1.2"/><text x="432" y="100" font-size="12" font-weight="800" fill="#0d9488" letter-spacing=".5">AGENT: LOOP WITH TOOLS</text><rect x="816" y="80" width="360" height="250" rx="12" fill="#d977060d" stroke="#d97706" stroke-width="1.2"/><text x="828" y="100" font-size="12" font-weight="800" fill="#d97706" letter-spacing=".5">BLUEPRINT: BOTH</text><rect x="64" y="170" width="88" height="50" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="108.0" y="200.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Step A</text><rect x="168" y="170" width="88" height="50" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="212.0" y="200.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Step B</text><rect x="272" y="170" width="88" height="50" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="316.0" y="200.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Step C</text><line x1="152" y1="195" x2="168" y2="195" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="256" y1="195" x2="272" y2="195" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="520" y="140" width="160" height="56" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="6 4"/><text x="600.0" y="173.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Model decides</text><rect x="520" y="236" width="160" height="56" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="600.0" y="269.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Call a tool</text><path d="M680,168 C740,168 740,264 680,264" fill="none" stroke="#0d9488" stroke-width="1.7" marker-end="url(#a)"/><path d="M520,264 C460,264 460,168 520,168" fill="none" stroke="#0d9488" stroke-width="1.7" marker-end="url(#a)"/><rect x="836" y="170" width="84" height="50" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="6 4"/><text x="878.0" y="200.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Implement</text><rect x="936" y="170" width="84" height="50" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="978.0" y="200.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Lint</text><rect x="1036" y="170" width="84" height="50" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="6 4"/><text x="1078.0" y="200.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Fix CI</text><line x1="920" y1="195" x2="936" y2="195" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="1020" y1="195" x2="1036" y2="195" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><text x="200" y="300" font-size="12" fill="#475569" text-anchor="middle">predictable, cannot handle surprises</text><text x="600" y="318" font-size="12" fill="#0d9488" text-anchor="middle">flexible, may skip required steps</text><text x="996" y="300" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">guaranteed steps + flexible ones</text></svg>