<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="360" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">AI is an amplifier (DORA 2025)</text><text x="24" y="56" font-size="13" fill="#475569">The same agents make a strong delivery system faster and a weak one more unstable</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="40" y="120" width="220" height="100" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="150.0" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">More AI-written code</text><text x="150.0" y="162" text-anchor="middle" font-size="12" fill="#334155">more changes, faster</text><line x1="260" y1="150" x2="420" y2="110" stroke="#15803d" stroke-width="1.7" marker-end="url(#a)"/><rect x="244.2" y="112.0" width="191.6" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="340.0" y="124.0" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">strong tests, small changes</text><line x1="260" y1="190" x2="420" y2="250" stroke="#be123c" stroke-width="1.7" marker-end="url(#r)"/><rect x="257.8" y="202.0" width="164.4" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="340.0" y="214.0" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">weak tests, big changes</text><rect x="420" y="70" width="330" height="80" rx="10" fill="#15803d14" stroke="#15803d" stroke-width="1.6"/><text x="585.0" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Higher throughput, stable</text><text x="585.0" y="112" text-anchor="middle" font-size="12" fill="#334155">changes ship faster, incidents flat</text><rect x="420" y="210" width="330" height="80" rx="10" fill="#be123c14" stroke="#be123c" stroke-width="1.6"/><text x="585.0" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Higher throughput, less stable</text><text x="585.0" y="252" text-anchor="middle" font-size="12" fill="#334155">more rollbacks and incidents</text><rect x="800" y="120" width="360" height="110" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="980.0" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">DORA 2025 findings</text><text x="980.0" y="162" text-anchor="middle" font-size="12" fill="#334155">~5,000 respondents · 90% use AI at work</text><text x="980.0" y="178" text-anchor="middle" font-size="12" fill="#334155">AI now raises throughput</text><text x="980.0" y="194" text-anchor="middle" font-size="12" fill="#334155">instability still rises with AI use</text><text x="24" y="344" font-size="11.5" fill="#64748b" text-anchor="start">Source: DORA, State of AI-assisted Software Development 2025 (dora.dev). The diagram is our illustration of its “amplifier” finding.</text></svg>