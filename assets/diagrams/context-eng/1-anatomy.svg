<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="430" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">What fills an agent’s context window</text><text x="24" y="56" font-size="13" fill="#475569">One illustrative mid-task snapshot; shares vary a lot by agent (our example)</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect class="gr" style="animation-delay:0.0s" x="40" y="110" width="42" height="90" rx="8" fill="#475569"/><text x="62.4" y="160" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">4%</text><text x="62.4" y="230" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">System prompt</text><rect class="gr" style="animation-delay:0.12s" x="85" y="110" width="87" height="90" rx="8" fill="#2563eb"/><text x="129.6" y="160" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">8%</text><text x="129.6" y="256" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">Tool definitions</text><rect class="gr" style="animation-delay:0.24s" x="174" y="110" width="42" height="90" rx="8" fill="#7c3aed"/><text x="196.79999999999998" y="160" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">4%</text><text x="196.79999999999998" y="230" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">Project file + memory</text><rect class="gr" style="animation-delay:0.36s" x="219" y="110" width="109" height="90" rx="8" fill="#0d9488"/><text x="275.2" y="160" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">10%</text><text x="275.2" y="256" font-size="13" fill="#0d9488" text-anchor="middle" font-weight="700">Retrieved documents</text><rect class="gr" style="animation-delay:0.48s" x="331" y="110" width="378" height="90" rx="8" fill="#d97706"/><text x="521.6" y="160" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">34%</text><text x="521.6" y="230" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">Tool results</text><rect class="gr" style="animation-delay:0.6s" x="712" y="110" width="199" height="90" rx="8" fill="#be123c"/><text x="812.8" y="160" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">18%</text><text x="812.8" y="256" font-size="13" fill="#be123c" text-anchor="middle" font-weight="700">Conversation + reasoning</text><rect class="gr" style="animation-delay:0.72s" x="914" y="110" width="243" height="90" rx="8" fill="#e2e8f0"/><text x="1036.8" y="160" font-size="15" fill="#475569" text-anchor="middle" font-weight="700">22%</text><text x="1036.8" y="230" font-size="13" fill="#64748b" text-anchor="middle" font-weight="700">Free space</text><text x="40" y="316" font-size="13.5" fill="#334155" text-anchor="start" font-weight="700">Stable (cacheable): system prompt, tools, project file</text><text x="40" y="338" font-size="13.5" fill="#334155" text-anchor="start">Grows every turn: tool results and conversation, usually the biggest and least useful part</text><text x="40" y="370" font-size="13" fill="#7c3aed" text-anchor="start" font-weight="700">Anthropic: “find the smallest possible set of high-signal tokens that maximize the likelihood of some desired outcome.”</text><text x="24" y="416" font-size="11.5" fill="#64748b" text-anchor="start">Shares are illustrative, not measured. Source for the principle: Anthropic, “Effective context engineering for AI agents”.</text></svg>