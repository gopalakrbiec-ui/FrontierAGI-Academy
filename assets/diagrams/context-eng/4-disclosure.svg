<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="380" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Progressive disclosure: how skills stay cheap</text><text x="24" y="56" font-size="13" fill="#475569">Three levels, from Anthropic’s Agent Skills post</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="fd" style="animation-delay:0.0s"><rect x="40" y="80" width="1120" height="74" rx="12" fill="#0d948814" stroke="#0d9488" stroke-width="1.8"/><text x="64" y="110" font-size="16" fill="#0d9488" text-anchor="start" font-weight="700">Level 1: name + description</text><text x="64" y="134" font-size="13" fill="#334155" text-anchor="start">pre-loaded for every installed skill · a line or two each</text></g><g class="fd" style="animation-delay:0.2s"><rect x="150" y="172" width="900" height="74" rx="12" fill="#2563eb14" stroke="#2563eb" stroke-width="1.8"/><text x="174" y="202" font-size="16" fill="#2563eb" text-anchor="start" font-weight="700">Level 2: SKILL.md body</text><text x="174" y="226" font-size="13" fill="#334155" text-anchor="start">read only when the skill looks relevant · instructions</text></g><g class="fd" style="animation-delay:0.4s"><rect x="260" y="264" width="680" height="74" rx="12" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.8"/><text x="284" y="294" font-size="16" fill="#7c3aed" text-anchor="start" font-weight="700">Level 3: extra files and scripts</text><text x="284" y="318" font-size="13" fill="#334155" text-anchor="start">opened or run only if needed · references, code</text></g><text x="24" y="366" font-size="11.5" fill="#64748b" text-anchor="start">Same idea for tools: Claude’s tool search tool lets an agent defer tool definitions until needed (Claude docs, context windows).</text></svg>