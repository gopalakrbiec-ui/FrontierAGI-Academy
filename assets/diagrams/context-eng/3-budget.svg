<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 366" width="1100" height="366" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1100" height="366" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Input tokens over a 40-turn toy run</text><text x="24" y="56" font-size="13" fill="#475569">Total input tokens the lead agent reads, by strategy (our toy model; sub-agents’ own tokens not counted)</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><text x="24" y="114" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">none</text><rect class="gr" style="animation-delay:0.0s" x="330" y="96" width="523.9" height="28" rx="6" fill="#be123c"/><text x="861.9019655423441" y="116" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">2.54M peak 118,000</text><text x="24" y="168" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">clear tool results</text><rect class="gr" style="animation-delay:0.15s" x="330" y="150" width="167.1" height="28" rx="6" fill="#d97706"/><text x="505.0710992477554" y="170" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">0.81M peak 26,980</text><text x="24" y="222" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">compaction</text><rect class="gr" style="animation-delay:0.3s" x="330" y="204" width="268.1" height="28" rx="6" fill="#7c3aed"/><text x="606.1388012618297" y="224" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">1.3M peak 59,200</text><text x="24" y="276" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">sub-agents</text><rect class="gr" style="animation-delay:0.44999999999999996s" x="330" y="258" width="173.3" height="28" rx="6" fill="#2563eb"/><text x="511.25891773841295" y="278" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">0.84M peak 35,700</text><text x="24" y="350" font-size="11.5" fill="#64748b" text-anchor="start">Source: data/code/context-eng-long-tasks/budget_sim.py (assumptions in the script). Anthropic reports multi-agent systems use ~15× the tokens of chat.</text></svg>