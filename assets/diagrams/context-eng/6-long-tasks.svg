<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="320" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Three techniques for long tasks</text><text x="24" y="56" font-size="13" fill="#475569">Anthropic’s guidance on which to use when</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="fd" style="animation-delay:0.0s"><rect x="30" y="90" width="360" height="180" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="210.0" y="112" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Compaction</text><text x="210.0" y="132" text-anchor="middle" font-size="12" fill="#334155"></text><text x="210.0" y="148" text-anchor="middle" font-size="12" fill="#334155">summarise and restart the window</text><text x="210.0" y="164" text-anchor="middle" font-size="12" fill="#334155"></text><text x="210.0" y="180" text-anchor="middle" font-size="12" fill="#334155">best for: tasks with lots of back-and-forth</text><text x="210.0" y="196" text-anchor="middle" font-size="12" fill="#334155"></text><text x="210.0" y="212" text-anchor="middle" font-size="12" fill="#334155">risk: can drop a detail that matters later</text></g><g class="fd" style="animation-delay:0.2s"><rect x="420" y="90" width="360" height="180" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="600.0" y="112" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Structured notes</text><text x="600.0" y="132" text-anchor="middle" font-size="12" fill="#334155"></text><text x="600.0" y="148" text-anchor="middle" font-size="12" fill="#334155">agent writes NOTES.md / to-dos, reads them back</text><text x="600.0" y="164" text-anchor="middle" font-size="12" fill="#334155"></text><text x="600.0" y="180" text-anchor="middle" font-size="12" fill="#334155">best for: iterative work with clear milestones</text><text x="600.0" y="196" text-anchor="middle" font-size="12" fill="#334155"></text><text x="600.0" y="212" text-anchor="middle" font-size="12" fill="#334155">risk: notes drift if never pruned</text></g><g class="fd" style="animation-delay:0.4s"><rect x="810" y="90" width="360" height="180" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="990.0" y="112" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Sub-agents</text><text x="990.0" y="132" text-anchor="middle" font-size="12" fill="#334155"></text><text x="990.0" y="148" text-anchor="middle" font-size="12" fill="#334155">clean windows, return 1,000–2,000-token summaries</text><text x="990.0" y="164" text-anchor="middle" font-size="12" fill="#334155"></text><text x="990.0" y="180" text-anchor="middle" font-size="12" fill="#334155">best for: research with parallel directions</text><text x="990.0" y="196" text-anchor="middle" font-size="12" fill="#334155"></text><text x="990.0" y="212" text-anchor="middle" font-size="12" fill="#334155">risk: many more tokens in total</text></g><text x="24" y="306" font-size="11.5" fill="#64748b" text-anchor="start">Source: Anthropic, “Effective context engineering for AI agents” (compaction, structured note-taking, sub-agent architectures). Risks are our reading.</text></svg>