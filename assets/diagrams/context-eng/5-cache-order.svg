<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="400" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Order the context so the cache can hit</text><text x="24" y="56" font-size="13" fill="#475569">Caches match on an exact prefix: anything that changes must come after the stable part (Claude prompt caching docs)</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><text x="40" y="100" font-size="15" fill="#be123c" text-anchor="start" font-weight="700">Breaks the cache every turn</text><text x="40" y="250" font-size="15" fill="#15803d" text-anchor="start" font-weight="700">Caches well</text><rect x="40" y="115" width="154" height="60" rx="8" fill="#be123c1f" stroke="#be123c" stroke-width="1.6"/><text x="117.0" y="151" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">Timestamp</text><rect x="200" y="115" width="214" height="60" rx="8" fill="#4755691f" stroke="#475569" stroke-width="1.6"/><text x="307.0" y="151" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">System prompt</text><rect x="420" y="115" width="194" height="60" rx="8" fill="#2563eb1f" stroke="#2563eb" stroke-width="1.6"/><text x="517.0" y="151" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">Tools</text><rect x="620" y="115" width="354" height="60" rx="8" fill="#be123c1f" stroke="#be123c" stroke-width="1.6"/><text x="797.0" y="151" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">History…</text><rect x="40" y="265" width="194" height="60" rx="8" fill="#2563eb1f" stroke="#2563eb" stroke-width="1.6"/><text x="137.0" y="301" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">Tools</text><rect x="240" y="265" width="214" height="60" rx="8" fill="#4755691f" stroke="#475569" stroke-width="1.6"/><text x="347.0" y="301" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">System prompt</text><rect x="460" y="265" width="164" height="60" rx="8" fill="#7c3aed1f" stroke="#7c3aed" stroke-width="1.6"/><text x="542.0" y="301" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">Project file</text><rect x="630" y="265" width="124" height="60" rx="8" fill="#15803d1f" stroke="#15803d" stroke-width="1.6"/><text x="692.0" y="301" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">◆ breakpoint</text><rect x="760" y="265" width="184" height="60" rx="8" fill="#be123c1f" stroke="#be123c" stroke-width="1.6"/><text x="852.0" y="301" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">History…</text><rect x="950" y="265" width="204" height="60" rx="8" fill="#be123c1f" stroke="#be123c" stroke-width="1.6"/><text x="1052.0" y="301" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">Timestamp + new message</text><text x="24" y="386" font-size="11.5" fill="#64748b" text-anchor="start">Docs: up to 4 cache breakpoints; 5-minute or 1-hour lifetimes; place the breakpoint at the end of the static prefix, not on the varying block.</text></svg>