<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="340" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Four things you can do with context</text><text x="24" y="56" font-size="13" fill="#475569">The write / select / compress / isolate framing used in LangChain’s context engineering repo, with examples from Anthropic’s docs</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="fd" style="animation-delay:0.0s"><rect x="30" y="90" width="260" height="190" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="160.0" y="112" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Write</text><text x="160.0" y="132" text-anchor="middle" font-size="12" fill="#334155">save it outside the window</text><text x="160.0" y="148" text-anchor="middle" font-size="12" fill="#334155"></text><text x="160.0" y="164" text-anchor="middle" font-size="12" fill="#334155">• notes files, to-do lists</text><text x="160.0" y="180" text-anchor="middle" font-size="12" fill="#334155">• memory tool</text><text x="160.0" y="196" text-anchor="middle" font-size="12" fill="#334155">• scratchpads</text></g><g class="fd" style="animation-delay:0.15s"><rect x="320" y="90" width="260" height="190" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="450.0" y="112" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Select</text><text x="450.0" y="132" text-anchor="middle" font-size="12" fill="#334155">pull in only what is needed</text><text x="450.0" y="148" text-anchor="middle" font-size="12" fill="#334155"></text><text x="450.0" y="164" text-anchor="middle" font-size="12" fill="#334155">• just-in-time retrieval</text><text x="450.0" y="180" text-anchor="middle" font-size="12" fill="#334155">• grep / glob over files</text><text x="450.0" y="196" text-anchor="middle" font-size="12" fill="#334155">• skills loaded on demand</text></g><g class="fd" style="animation-delay:0.3s"><rect x="610" y="90" width="260" height="190" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="740.0" y="112" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Compress</text><text x="740.0" y="132" text-anchor="middle" font-size="12" fill="#334155">keep the gist, drop the bulk</text><text x="740.0" y="148" text-anchor="middle" font-size="12" fill="#334155"></text><text x="740.0" y="164" text-anchor="middle" font-size="12" fill="#334155">• compaction (summaries)</text><text x="740.0" y="180" text-anchor="middle" font-size="12" fill="#334155">• tool result clearing</text><text x="740.0" y="196" text-anchor="middle" font-size="12" fill="#334155">• trimming old turns</text></g><g class="fd" style="animation-delay:0.44999999999999996s"><rect x="900" y="90" width="260" height="190" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="1030.0" y="112" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Isolate</text><text x="1030.0" y="132" text-anchor="middle" font-size="12" fill="#334155">give work its own window</text><text x="1030.0" y="148" text-anchor="middle" font-size="12" fill="#334155"></text><text x="1030.0" y="164" text-anchor="middle" font-size="12" fill="#334155">• sub-agents</text><text x="1030.0" y="180" text-anchor="middle" font-size="12" fill="#334155">• sandboxes holding big data</text><text x="1030.0" y="196" text-anchor="middle" font-size="12" fill="#334155">• separate state fields</text></g><text x="24" y="326" font-size="11.5" fill="#64748b" text-anchor="start">Sources: github.com/langchain-ai/context_engineering (notebooks 1–4); Anthropic engineering blog and Claude docs.</text></svg>