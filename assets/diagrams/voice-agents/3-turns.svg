<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="360" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">When has the caller finished?</text><text x="24" y="56" font-size="13" fill="#475569">Silence alone (VAD) vs a turn-detection model that also listens to words and tone (Smart Turn, LiveKit turn detector)</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="24" y="76" width="560" height="250" rx="12" fill="#d977060d" stroke="#d97706" stroke-width="1.2"/><text x="36" y="96" font-size="12" font-weight="800" fill="#d97706" letter-spacing=".5">SILENCE TIMER (VAD ONLY)</text><rect x="616" y="76" width="560" height="250" rx="12" fill="#15803d0d" stroke="#15803d" stroke-width="1.2"/><text x="628" y="96" font-size="12" font-weight="800" fill="#15803d" letter-spacing=".5">SEMANTIC / AUDIO TURN MODEL</text><rect x="50" y="110" width="510" height="42" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="305.0" y="136.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">“My order number is…”</text><rect x="50" y="162" width="510" height="42" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="305.0" y="188.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">(pause to find it)</text><rect x="50" y="214" width="510" height="42" rx="10" fill="#be123c14" stroke="#be123c" stroke-width="1.6"/><text x="305.0" y="240.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Agent jumps in ✗</text><rect x="50" y="266" width="510" height="42" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="305.0" y="292.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Caller talks over it</text><rect x="642" y="110" width="510" height="42" rx="10" fill="#15803d14" stroke="#15803d" stroke-width="1.6"/><text x="897.0" y="136.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">“My order number is…”</text><rect x="642" y="162" width="510" height="42" rx="10" fill="#15803d14" stroke="#15803d" stroke-width="1.6"/><text x="897.0" y="188.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">(pause: sentence not finished)</text><rect x="642" y="214" width="510" height="42" rx="10" fill="#15803d14" stroke="#15803d" stroke-width="1.6"/><text x="897.0" y="240.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Model waits ✓</text><rect x="642" y="266" width="510" height="42" rx="10" fill="#15803d14" stroke="#15803d" stroke-width="1.6"/><text x="897.0" y="292.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">“…4-7-2-9.” → reply</text><text x="24" y="348" font-size="11.5" fill="#64748b" text-anchor="start">Smart Turn v3.2: 23 languages, ~10 ms on some CPUs, under 100 ms on most cloud instances, runs only during silences (its README).</text></svg>