<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="470" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">The voice agent stack</text><text x="24" y="56" font-size="13" fill="#475569">Layers and example products; names from public repos and our lab-updates data, not an endorsement</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="fd" style="animation-delay:0.0s"><rect x="24" y="76" width="1152" height="54" rx="10" fill="#47556912" stroke="#475569" stroke-width="1.6"/><text x="44" y="100" font-size="15" fill="#475569" text-anchor="start" font-weight="700">Telephony and transport</text><text x="44" y="120" font-size="12.5" fill="#334155" text-anchor="start">PSTN / SIP, WebRTC, WebSockets</text><text x="1156" y="110" font-size="13" fill="#0f172a" text-anchor="end" font-weight="700">Twilio, LiveKit SIP, browser WebRTC</text></g><g class="fd" style="animation-delay:0.12s"><rect x="24" y="140" width="1152" height="54" rx="10" fill="#0f172a12" stroke="#0f172a" stroke-width="1.6"/><text x="44" y="164" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">Orchestration framework</text><text x="44" y="184" font-size="12.5" fill="#334155" text-anchor="start">pipelines, turn-taking, interruptions</text><text x="1156" y="174" font-size="13" fill="#0f172a" text-anchor="end" font-weight="700">Pipecat, LiveKit Agents, OpenAI Agents SDK</text></g><g class="fd" style="animation-delay:0.24s"><rect x="24" y="204" width="1152" height="54" rx="10" fill="#be123c12" stroke="#be123c" stroke-width="1.6"/><text x="44" y="228" font-size="15" fill="#be123c" text-anchor="start" font-weight="700">Speech-to-speech models</text><text x="44" y="248" font-size="12.5" fill="#334155" text-anchor="start">audio in and out</text><text x="1156" y="238" font-size="13" fill="#0f172a" text-anchor="end" font-weight="700">OpenAI gpt-realtime, Gemini Live, Grok Voice ⚠️</text></g><g class="fd" style="animation-delay:0.36s"><rect x="24" y="268" width="1152" height="54" rx="10" fill="#2563eb12" stroke="#2563eb" stroke-width="1.6"/><text x="44" y="292" font-size="15" fill="#2563eb" text-anchor="start" font-weight="700">Speech-to-text</text><text x="44" y="312" font-size="12.5" fill="#334155" text-anchor="start">streaming transcription</text><text x="1156" y="302" font-size="13" fill="#0f172a" text-anchor="end" font-weight="700">Whisper-family, Deepgram ⚠️, Voxtral</text></g><g class="fd" style="animation-delay:0.48s"><rect x="24" y="332" width="1152" height="54" rx="10" fill="#7c3aed12" stroke="#7c3aed" stroke-width="1.6"/><text x="44" y="356" font-size="15" fill="#7c3aed" text-anchor="start" font-weight="700">Language model</text><text x="44" y="376" font-size="12.5" fill="#334155" text-anchor="start">reasoning, tools</text><text x="1156" y="366" font-size="13" fill="#0f172a" text-anchor="end" font-weight="700">any chat model</text></g><g class="fd" style="animation-delay:0.6s"><rect x="24" y="396" width="1152" height="54" rx="10" fill="#0d948812" stroke="#0d9488" stroke-width="1.6"/><text x="44" y="420" font-size="15" fill="#0d9488" text-anchor="start" font-weight="700">Text-to-speech</text><text x="44" y="440" font-size="12.5" fill="#334155" text-anchor="start">natural voices, streaming</text><text x="1156" y="430" font-size="13" fill="#0f172a" text-anchor="end" font-weight="700">ElevenLabs ⚠️, MAI-Voice, open models</text></g></svg>