<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="400" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">One support call, start to finish</text><text x="24" y="56" font-size="13" fill="#475569">Our worked example: refund for a broken order</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="fd" style="animation-delay:0.0s"><rect x="24" y="120" width="150" height="90" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="99.0" y="170.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Greet + disclose AI</text></g><line x1="174" y1="165" x2="190" y2="165" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.15s"><rect x="190" y="120" width="150" height="90" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="265.0" y="170.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Verify caller</text></g><line x1="340" y1="165" x2="356" y2="165" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.3s"><rect x="356" y="120" width="150" height="90" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="431.0" y="170.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Listen: broken item</text></g><line x1="506" y1="165" x2="522" y2="165" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.44999999999999996s"><rect x="522" y="120" width="150" height="90" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="597.0" y="170.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">“Let me check that…”</text></g><line x1="672" y1="165" x2="688" y2="165" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.6s"><rect x="688" y="120" width="150" height="90" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="763.0" y="170.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Tool: look up order</text></g><line x1="838" y1="165" x2="854" y2="165" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.75s"><rect x="854" y="120" width="150" height="90" rx="10" fill="#be123c14" stroke="#be123c" stroke-width="1.6"/><text x="929.0" y="170.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">$240 &gt; $100 limit</text></g><line x1="1004" y1="165" x2="1020" y2="165" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.8999999999999999s"><rect x="1020" y="120" width="150" height="90" rx="10" fill="#15803d14" stroke="#15803d" stroke-width="1.6"/><text x="1095.0" y="170.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Warm transfer to human</text></g><text x="24" y="260" font-size="13.5" fill="#334155" text-anchor="start" font-weight="700">Filler speech covers the tool call; the transfer passes a summary so the caller does not repeat themselves.</text><text x="24" y="284" font-size="13" fill="#334155" text-anchor="start">OpenAI’s realtime agents demo shows the same idea: a fast realtime agent talks while a stronger text model handles tools (“chat-supervisor”).</text><text x="24" y="388" font-size="11.5" fill="#64748b" text-anchor="start">Illustrative flow.</text></svg>