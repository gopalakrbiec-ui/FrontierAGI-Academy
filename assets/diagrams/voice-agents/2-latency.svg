<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1100" height="360" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">From “caller stops talking” to “agent starts talking”</text><text x="24" y="56" font-size="13" fill="#475569">Toy latency budget in milliseconds (latency_budget.py); grey = after tuning</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><text x="24" y="108" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">cascade     browser (WebRTC)</text><rect class="gr" style="animation-delay:0.0s" x="330" y="90" width="528" height="24" rx="5" fill="#7c3aed"/><text x="864.5" y="108" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700">1510 ms</text><rect x="330" y="118" width="388" height="12" rx="4" fill="#94a3b8"/><text x="724.5" y="129" font-size="11.5" fill="#475569" text-anchor="start">tuned 1110</text><text x="24" y="170" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">cascade     phone line (PSTN)</text><rect class="gr" style="animation-delay:0.15s" x="330" y="152" width="595" height="24" rx="5" fill="#7c3aed"/><text x="931.0" y="170" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700">1700 ms</text><rect x="330" y="180" width="455" height="12" rx="4" fill="#94a3b8"/><text x="791.0" y="191" font-size="11.5" fill="#475569" text-anchor="start">tuned 1300</text><text x="24" y="232" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">speech-to-speech browser (WebRTC)</text><rect class="gr" style="animation-delay:0.3s" x="330" y="214" width="354" height="24" rx="5" fill="#be123c"/><text x="689.5" y="232" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700">1010 ms</text><rect x="330" y="242" width="214" height="12" rx="4" fill="#94a3b8"/><text x="549.5" y="253" font-size="11.5" fill="#475569" text-anchor="start">tuned 610</text><text x="24" y="294" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">speech-to-speech phone line (PSTN)</text><rect class="gr" style="animation-delay:0.44999999999999996s" x="330" y="276" width="420" height="24" rx="5" fill="#be123c"/><text x="756.0" y="294" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700">1200 ms</text><rect x="330" y="304" width="280" height="12" rx="4" fill="#94a3b8"/><text x="616.0" y="315" font-size="11.5" fill="#475569" text-anchor="start">tuned 800</text><line x1="610" y1="76" x2="610" y2="320" stroke="#15803d" stroke-dasharray="5 4"/><text x="614.0" y="74" font-size="12" fill="#15803d" text-anchor="start" font-weight="700">800 ms</text><text x="24" y="348" font-size="11.5" fill="#64748b" text-anchor="start">Humans usually leave gaps of a few hundred ms between turns (conversation research ⚠️); 800 ms is a common practical target (our reading).</text></svg>