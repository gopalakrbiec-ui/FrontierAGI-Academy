<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 528" width="1100" height="528" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1100" height="528" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Cost per call minute (example prices)</text><text x="24" y="56" font-size="13" fill="#475569">Voice agent parts vs a human agent at $18/hour, 75% occupancy (cost_per_minute.py)</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><text x="24" y="114" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">speech-to-text</text><rect class="gr" style="animation-delay:0.0s" x="330" y="96" width="8.2" height="28" rx="6" fill="#0d9488"/><text x="346.16" y="116" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700"> $0.006</text><text x="24" y="168" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">LLM tokens</text><rect class="gr" style="animation-delay:0.15s" x="330" y="150" width="13.6" height="28" rx="6" fill="#0d9488"/><text x="351.6" y="170" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700"> $0.010</text><text x="24" y="222" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">text-to-speech</text><rect class="gr" style="animation-delay:0.3s" x="330" y="204" width="20.4" height="28" rx="6" fill="#0d9488"/><text x="358.4" y="224" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700"> $0.015</text><text x="24" y="276" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">telephony</text><rect class="gr" style="animation-delay:0.44999999999999996s" x="330" y="258" width="13.6" height="28" rx="6" fill="#0d9488"/><text x="351.6" y="278" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700"> $0.010</text><text x="24" y="330" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">platform / hosting</text><rect class="gr" style="animation-delay:0.6s" x="330" y="312" width="13.6" height="28" rx="6" fill="#0d9488"/><text x="351.6" y="332" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700"> $0.010</text><text x="24" y="384" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">voice agent total</text><rect class="gr" style="animation-delay:0.75s" x="330" y="366" width="69.4" height="28" rx="6" fill="#be123c"/><text x="407.36" y="386" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700"> $0.051</text><text x="24" y="438" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">human agent</text><rect class="gr" style="animation-delay:0.8999999999999999s" x="330" y="420" width="544.0" height="28" rx="6" fill="#475569"/><text x="882.0" y="440" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700"> $0.400</text><text x="24" y="512" font-size="11.5" fill="#64748b" text-anchor="start">Assumptions in data/code/voice-agents-production/cost_per_minute.py; not vendor prices. monthly, all human: $120,000; agent first, 60% contained: $63,300 (53%)</text></svg>