<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="440" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Two ways to build a voice agent</text><text x="24" y="56" font-size="13" fill="#475569">A cascade of three models, or one speech-to-speech model (both supported by Pipecat and LiveKit Agents)</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="24" y="76" width="1152" height="160" rx="12" fill="#2563eb0d" stroke="#2563eb" stroke-width="1.2"/><text x="36" y="96" font-size="12" font-weight="800" fill="#2563eb" letter-spacing=".5">CASCADE</text><rect x="24" y="256" width="1152" height="150" rx="12" fill="#be123c0d" stroke="#be123c" stroke-width="1.2"/><text x="36" y="276" font-size="12" font-weight="800" fill="#be123c" letter-spacing=".5">SPEECH-TO-SPEECH (REALTIME MODEL)</text><g class="fd" style="animation-delay:0.0s"><rect x="50" y="112" width="190" height="80" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="145.0" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Caller audio</text><text x="145.0" y="154" text-anchor="middle" font-size="12" fill="#334155">mic / phone</text></g><line x1="240" y1="152" x2="278" y2="152" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.12s"><rect x="278" y="112" width="190" height="80" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="373.0" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Speech-to-text</text><text x="373.0" y="154" text-anchor="middle" font-size="12" fill="#334155">streaming transcript</text></g><line x1="468" y1="152" x2="506" y2="152" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.24s"><rect x="506" y="112" width="190" height="80" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="601.0" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">LLM</text><text x="601.0" y="154" text-anchor="middle" font-size="12" fill="#334155">text in, text out, tools</text></g><line x1="696" y1="152" x2="734" y2="152" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.36s"><rect x="734" y="112" width="190" height="80" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="829.0" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Text-to-speech</text><text x="829.0" y="154" text-anchor="middle" font-size="12" fill="#334155">streams audio back</text></g><line x1="924" y1="152" x2="962" y2="152" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.48s"><rect x="962" y="112" width="190" height="80" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="1057.0" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Caller hears</text><text x="1057.0" y="154" text-anchor="middle" font-size="12" fill="#334155">speaker</text></g><rect x="50" y="290" width="190" height="80" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="145.0" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Caller audio</text><text x="145.0" y="332" text-anchor="middle" font-size="12" fill="#334155">mic / phone</text><rect x="390" y="290" width="420" height="80" rx="10" fill="#be123c14" stroke="#be123c" stroke-width="1.6"/><text x="600.0" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Realtime model</text><text x="600.0" y="332" text-anchor="middle" font-size="12" fill="#334155">audio in → audio out, tools</text><rect x="962" y="290" width="190" height="80" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="1057.0" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Caller hears</text><text x="1057.0" y="332" text-anchor="middle" font-size="12" fill="#334155">speaker</text><line x1="240" y1="330" x2="388" y2="330" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="812" y1="330" x2="960" y2="330" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><text x="24" y="428" font-size="11.5" fill="#64748b" text-anchor="start">Cascade: pick each model, see the text, easier to control. Speech-to-speech: fewer hops, keeps tone of voice, less visible in between (our summary).</text></svg>