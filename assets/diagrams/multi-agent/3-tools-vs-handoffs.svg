<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="430" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Agents as tools vs hand-offs</text><text x="24" y="56" font-size="13" fill="#475569">The two patterns the OpenAI Agents SDK docs name as most common; LangGraph’s supervisor and swarm libraries follow the same split</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="24" y="76" width="560" height="320" rx="12" fill="#7c3aed0d" stroke="#7c3aed" stroke-width="1.2"/><text x="36" y="96" font-size="12" font-weight="800" fill="#7c3aed" letter-spacing=".5">AGENTS AS TOOLS (SUPERVISOR)</text><rect x="616" y="76" width="560" height="320" rx="12" fill="#be123c0d" stroke="#be123c" stroke-width="1.2"/><text x="628" y="96" font-size="12" font-weight="800" fill="#be123c" letter-spacing=".5">HAND-OFFS (SWARM)</text><rect x="105.0" y="118" width="90" height="44" rx="10" fill="#0f172a14" stroke="#0f172a" stroke-width="1.6"/><text x="150.0" y="145.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">User</text><rect x="245.0" y="118" width="110" height="44" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="300.0" y="145.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Manager</text><rect x="140.0" y="268" width="120" height="44" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="200.0" y="295.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Refund spec.</text><rect x="360.0" y="268" width="120" height="44" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="420.0" y="295.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Policy spec.</text><line x1="195" y1="140" x2="245" y2="140" stroke="#334155" stroke-width="1.7" marker-end="url(#a)" marker-start="url(#a)"/><line x1="285" y1="162" x2="215" y2="268" stroke="#7c3aed" stroke-width="1.7" marker-end="url(#a)" marker-start="url(#a)"/><rect x="232.4" y="197.0" width="35.2" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="250.0" y="209.0" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">call</text><line x1="315" y1="162" x2="405" y2="268" stroke="#7c3aed" stroke-width="1.7" marker-end="url(#a)" marker-start="url(#a)"/><rect x="342.4" y="197.0" width="35.2" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="360.0" y="209.0" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">call</text><text x="300" y="360" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="700">Manager talks to the user and writes the final answer</text><rect x="695.0" y="118" width="90" height="44" rx="10" fill="#0f172a14" stroke="#0f172a" stroke-width="1.6"/><text x="740.0" y="145.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">User</text><rect x="835.0" y="118" width="110" height="44" rx="10" fill="#be123c14" stroke="#be123c" stroke-width="1.6"/><text x="890.0" y="145.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Triage</text><rect x="1000.0" y="118" width="120" height="44" rx="10" fill="#be123c14" stroke="#be123c" stroke-width="1.6"/><text x="1060.0" y="145.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Refund agent</text><rect x="1000.0" y="268" width="120" height="44" rx="10" fill="#be123c14" stroke="#be123c" stroke-width="1.6"/><text x="1060.0" y="295.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Policy agent</text><line x1="785" y1="140" x2="835" y2="140" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="945" y1="140" x2="1000" y2="140" stroke="#be123c" stroke-width="1.7" marker-end="url(#a)"/><rect x="941.3" y="122.0" width="62.4" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="972.5" y="134.0" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">hand off</text><line x1="1060" y1="162" x2="1060" y2="268" stroke="#be123c" stroke-width="1.7" marker-end="url(#a)"/><rect x="1028.8" y="197.0" width="62.4" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="1060.0" y="209.0" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">hand off</text><path d="M1000,290 C850,290 760,240 745,163" fill="none" stroke="#be123c" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="900" y="360" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="700">Whoever is active talks to the user directly</text></svg>