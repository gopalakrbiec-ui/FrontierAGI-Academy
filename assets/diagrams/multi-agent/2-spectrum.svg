<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="300" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Who decides what happens next?</text><text x="24" y="56" font-size="13" fill="#475569">Anthropic separates workflows (code decides) from agents (the model decides); OpenAI’s SDK docs call these orchestrating via code vs via LLM</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="gq"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#be123c"/></linearGradient></defs><rect x="60" y="120" width="1080" height="18" rx="9" fill="url(#gq)"/><g class="fd" style="animation-delay:0.0s"><circle cx="90" cy="129" r="10" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="90" y="170" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Chain</text></g><g class="fd" style="animation-delay:0.1s"><circle cx="230" cy="129" r="10" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="230" y="100" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Router</text></g><g class="fd" style="animation-delay:0.2s"><circle cx="380" cy="129" r="10" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="380" y="170" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Parallel / vote</text></g><g class="fd" style="animation-delay:0.30000000000000004s"><circle cx="540" cy="129" r="10" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="540" y="100" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Evaluator loop</text></g><g class="fd" style="animation-delay:0.4s"><circle cx="700" cy="129" r="10" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="700" y="170" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Supervisor</text></g><g class="fd" style="animation-delay:0.5s"><circle cx="850" cy="129" r="10" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="850" y="100" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Hierarchy</text></g><g class="fd" style="animation-delay:0.6000000000000001s"><circle cx="990" cy="129" r="10" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="990" y="170" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Hand-offs / swarm</text></g><g class="fd" style="animation-delay:0.7000000000000001s"><circle cx="1120" cy="129" r="10" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="1120" y="100" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Open group chat</text></g><text x="60" y="230" font-size="14" fill="#475569" text-anchor="start" font-weight="700">Code decides: predictable, cheap, easy to test</text><text x="1140" y="230" font-size="14" fill="#be123c" text-anchor="end" font-weight="700">Model decides: flexible, costly, harder to test</text><text x="24" y="286" font-size="11.5" fill="#64748b" text-anchor="start">Placement on the line is our reading.</text></svg>