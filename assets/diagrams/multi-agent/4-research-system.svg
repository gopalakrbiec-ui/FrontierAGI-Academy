<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="400" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Case study: Anthropic’s multi-agent research system</text><text x="24" y="56" font-size="13" fill="#475569">Numbers as reported by Anthropic in its 2025 engineering post</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="65.0" y="178" width="150" height="44" rx="10" fill="#0f172a14" stroke="#0f172a" stroke-width="1.6"/><text x="140.0" y="205.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">User question</text><rect x="290.0" y="178" width="180" height="44" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="380.0" y="205.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Lead agent (plans)</text><rect x="550.0" y="88" width="200" height="44" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="650.0" y="115.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Sub-agent 1 · searches</text><line x1="470" y1="200" x2="548" y2="110" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="550.0" y="148" width="200" height="44" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="650.0" y="175.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Sub-agent 2 · searches</text><line x1="470" y1="200" x2="548" y2="170" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="550.0" y="208" width="200" height="44" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="650.0" y="235.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Sub-agent 3 · searches</text><line x1="470" y1="200" x2="548" y2="230" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="550.0" y="268" width="200" height="44" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="650.0" y="295.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Sub-agent 4 · searches</text><line x1="470" y1="200" x2="548" y2="290" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="840.0" y="178" width="180" height="44" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="930.0" y="205.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Lead synthesises</text><rect x="1065.0" y="178" width="110" height="44" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="1120.0" y="205.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Citations</text><line x1="752" y1="110" x2="838" y2="200" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="752" y1="170" x2="838" y2="200" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="752" y1="230" x2="838" y2="200" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="752" y1="290" x2="838" y2="200" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="216" y1="200" x2="288" y2="200" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="1022" y1="200" x2="1063" y2="200" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><text x="40" y="352" font-size="12.5" fill="#334155" text-anchor="start" font-weight="700">+90.2% vs single-agent Opus 4 on its internal research eval · 3–5 sub-agents in parallel, each using 3+ tools in parallel · research time cut by up to 90%</text><text x="40" y="374" font-size="12.5" fill="#be123c" text-anchor="start">Cost: multi-agent systems used ~15× the tokens of chat. Not a good fit for most coding tasks, per the same post.</text></svg>