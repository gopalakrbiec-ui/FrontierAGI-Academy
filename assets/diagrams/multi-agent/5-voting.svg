<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1100" height="380" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Voting helps less when agents make the same mistakes</text><text x="24" y="56" font-size="13" fill="#475569">Majority-vote accuracy, one agent 70% right (toy model from voting.py)</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><text x="24" y="120" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">1 agent</text><rect class="gr" style="animation-delay:0.0s" x="180" y="96" width="283" height="22" rx="5" fill="#0d9488"/><text x="468.80000000000007" y="113" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700">70.2% independent</text><rect class="gr" style="animation-delay:0.1s" x="180" y="122" width="274" height="22" rx="5" fill="#d97706"/><text x="460.3999999999999" y="139" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700">69.6% correlated</text><text x="24" y="186" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">3 agents</text><rect class="gr" style="animation-delay:0.15s" x="180" y="162" width="398" height="22" rx="5" fill="#0d9488"/><text x="583.6000000000001" y="179" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700">78.4% independent</text><rect class="gr" style="animation-delay:0.25s" x="180" y="188" width="340" height="22" rx="5" fill="#d97706"/><text x="526.1999999999999" y="205" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700">74.3% correlated</text><text x="24" y="252" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">5 agents</text><rect class="gr" style="animation-delay:0.3s" x="180" y="228" width="473" height="22" rx="5" fill="#0d9488"/><text x="659.1999999999999" y="245" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700">83.8% independent</text><rect class="gr" style="animation-delay:0.4s" x="180" y="254" width="374" height="22" rx="5" fill="#d97706"/><text x="559.8000000000001" y="271" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700">76.7% correlated</text><text x="24" y="318" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">9 agents</text><rect class="gr" style="animation-delay:0.44999999999999996s" x="180" y="294" width="560" height="22" rx="5" fill="#0d9488"/><text x="746.0" y="311" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700">90.0% independent</text><rect class="gr" style="animation-delay:0.5499999999999999s" x="180" y="320" width="421" height="22" rx="5" fill="#d97706"/><text x="607.3999999999999" y="337" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700">80.1% correlated</text><text x="24" y="366" font-size="11.5" fill="#64748b" text-anchor="start">Source: data/code/multi-agent-parallel-debate/voting.py. Bars start at 50%. Correlated = half the time all agents share one answer.</text></svg>