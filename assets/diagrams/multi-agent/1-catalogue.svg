<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="700" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Eight ways to arrange agents</text><text x="24" y="56" font-size="13" fill="#475569">From fixed workflows (left) to agents that decide who works next (right); names from Anthropic, OpenAI and LangGraph docs</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="fd" style="animation-delay:0.0s"><rect x="30" y="76" width="270" height="290" rx="14" fill="#4755690d" stroke="#475569" stroke-width="1.6"/><text x="165" y="104" font-size="15" fill="#475569" text-anchor="middle" font-weight="700">Chain</text><rect x="110.0" y="134" width="110" height="44" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="165.0" y="161.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Agent 1</text><line x1="165" y1="178" x2="165" y2="204" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="110.0" y="204" width="110" height="44" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="165.0" y="231.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Agent 2</text><line x1="165" y1="248" x2="165" y2="274" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="110.0" y="274" width="110" height="44" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="165.0" y="301.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Agent 3</text><text x="165" y="351" font-size="12" fill="#334155" text-anchor="middle">fixed steps, gates between</text></g><g class="fd" style="animation-delay:0.1s"><rect x="320" y="76" width="270" height="290" rx="14" fill="#2563eb0d" stroke="#2563eb" stroke-width="1.6"/><text x="455" y="104" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="700">Router</text><rect x="400.0" y="134" width="110" height="44" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="455.0" y="161.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Router</text><line x1="455" y1="178" x2="370" y2="254" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="331.0" y="254" width="78" height="44" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="370.0" y="281.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Billing</text><line x1="455" y1="178" x2="455" y2="254" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="416.0" y="254" width="78" height="44" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="455.0" y="281.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Tech</text><line x1="455" y1="178" x2="540" y2="254" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="501.0" y="254" width="78" height="44" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="540.0" y="281.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Refund</text><text x="455" y="351" font-size="12" fill="#334155" text-anchor="middle">classify once, send to one</text></g><g class="fd" style="animation-delay:0.2s"><rect x="610" y="76" width="270" height="290" rx="14" fill="#0d94880d" stroke="#0d9488" stroke-width="1.6"/><text x="745" y="104" font-size="15" fill="#0d9488" text-anchor="middle" font-weight="700">Parallel / vote</text><rect x="625.0" y="144" width="70" height="44" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="660.0" y="171.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">A1</text><line x1="660" y1="188" x2="745" y2="254" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="710.0" y="144" width="70" height="44" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="745.0" y="171.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">A2</text><line x1="745" y1="188" x2="745" y2="254" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="795.0" y="144" width="70" height="44" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="830.0" y="171.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">A3</text><line x1="830" y1="188" x2="745" y2="254" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="690.0" y="254" width="110" height="44" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="745.0" y="281.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Aggregate</text><text x="745" y="351" font-size="12" fill="#334155" text-anchor="middle">same or split task, combine</text></g><g class="fd" style="animation-delay:0.30000000000000004s"><rect x="900" y="76" width="270" height="290" rx="14" fill="#d977060d" stroke="#d97706" stroke-width="1.6"/><text x="1035" y="104" font-size="15" fill="#d97706" text-anchor="middle" font-weight="700">Evaluator–optimizer</text><rect x="980.0" y="144" width="110" height="44" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="1035.0" y="171.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Generator</text><rect x="980.0" y="254" width="110" height="44" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="1035.0" y="281.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Evaluator</text><line x1="1015" y1="188" x2="1015" y2="254" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="1055" y1="254" x2="1055" y2="188" stroke="#d97706" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="1100" y="226" font-size="12" fill="#d97706" text-anchor="middle">feedback</text><text x="1035" y="351" font-size="12" fill="#334155" text-anchor="middle">loop until it passes</text></g><g class="fd" style="animation-delay:0.4s"><rect x="30" y="386" width="270" height="290" rx="14" fill="#7c3aed0d" stroke="#7c3aed" stroke-width="1.6"/><text x="165" y="414" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="700">Supervisor (agents as tools)</text><rect x="110.0" y="444" width="110" height="44" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="165.0" y="471.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Supervisor</text><line x1="165" y1="488" x2="80" y2="564" stroke="#7c3aed" stroke-width="1.7" marker-end="url(#a)" marker-start="url(#a)"/><rect x="41.0" y="564" width="78" height="44" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="80.0" y="591.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Worker 1</text><line x1="165" y1="488" x2="165" y2="564" stroke="#7c3aed" stroke-width="1.7" marker-end="url(#a)" marker-start="url(#a)"/><rect x="126.0" y="564" width="78" height="44" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="165.0" y="591.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Worker 2</text><line x1="165" y1="488" x2="250" y2="564" stroke="#7c3aed" stroke-width="1.7" marker-end="url(#a)" marker-start="url(#a)"/><rect x="211.0" y="564" width="78" height="44" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="250.0" y="591.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Worker 3</text><text x="165" y="661" font-size="12" fill="#334155" text-anchor="middle">supervisor keeps control, owns answer</text></g><g class="fd" style="animation-delay:0.5s"><rect x="320" y="386" width="270" height="290" rx="14" fill="#be123c0d" stroke="#be123c" stroke-width="1.6"/><text x="455" y="414" font-size="15" fill="#be123c" text-anchor="middle" font-weight="700">Hand-offs / swarm</text><rect x="347.0" y="464" width="86" height="44" rx="10" fill="#be123c14" stroke="#be123c" stroke-width="1.6"/><text x="390.0" y="491.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Triage</text><rect x="477.0" y="464" width="86" height="44" rx="10" fill="#be123c14" stroke="#be123c" stroke-width="1.6"/><text x="520.0" y="491.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Billing</text><rect x="412.0" y="564" width="86" height="44" rx="10" fill="#be123c14" stroke="#be123c" stroke-width="1.6"/><text x="455.0" y="591.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Refund</text><line x1="433" y1="486" x2="477" y2="486" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="520" y1="508" x2="470" y2="564" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="440" y1="564" x2="395" y2="508" stroke="#be123c" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="455" y="661" font-size="12" fill="#334155" text-anchor="middle">control passes to whoever is active</text></g><g class="fd" style="animation-delay:0.6000000000000001s"><rect x="610" y="386" width="270" height="290" rx="14" fill="#0891b20d" stroke="#0891b2" stroke-width="1.6"/><text x="745" y="414" font-size="15" fill="#0891b2" text-anchor="middle" font-weight="700">Debate</text><rect x="635.0" y="454" width="90" height="44" rx="10" fill="#0891b214" stroke="#0891b2" stroke-width="1.6"/><text x="680.0" y="481.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Agent A</text><rect x="765.0" y="454" width="90" height="44" rx="10" fill="#0891b214" stroke="#0891b2" stroke-width="1.6"/><text x="810.0" y="481.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Agent B</text><rect x="690.0" y="564" width="110" height="44" rx="10" fill="#0891b214" stroke="#0891b2" stroke-width="1.6"/><text x="745.0" y="591.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Judge / vote</text><line x1="725" y1="470" x2="765" y2="470" stroke="#0891b2" stroke-width="1.7" marker-end="url(#a)" marker-start="url(#a)"/><line x1="680" y1="498" x2="730" y2="564" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="810" y1="498" x2="760" y2="564" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><text x="745" y="661" font-size="12" fill="#334155" text-anchor="middle">argue over rounds, then decide</text></g><g class="fd" style="animation-delay:0.7000000000000001s"><rect x="900" y="386" width="270" height="290" rx="14" fill="#15803d0d" stroke="#15803d" stroke-width="1.6"/><text x="1035" y="414" font-size="15" fill="#15803d" text-anchor="middle" font-weight="700">Hierarchy</text><rect x="980.0" y="434" width="110" height="44" rx="10" fill="#15803d14" stroke="#15803d" stroke-width="1.6"/><text x="1035.0" y="461.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Top</text><rect x="927.0" y="514" width="86" height="44" rx="10" fill="#15803d14" stroke="#15803d" stroke-width="1.6"/><text x="970.0" y="541.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Lead 1</text><rect x="1057.0" y="514" width="86" height="44" rx="10" fill="#15803d14" stroke="#15803d" stroke-width="1.6"/><text x="1100.0" y="541.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Lead 2</text><line x1="1025" y1="478" x2="980" y2="514" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="1045" y1="478" x2="1090" y2="514" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="918.0" y="589" width="44" height="44" rx="10" fill="#15803d14" stroke="#15803d" stroke-width="1.6"/><text x="940.0" y="616.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">W</text><line x1="970" y1="558" x2="940" y2="589" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="978.0" y="589" width="44" height="44" rx="10" fill="#15803d14" stroke="#15803d" stroke-width="1.6"/><text x="1000.0" y="616.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">W</text><line x1="970" y1="558" x2="1000" y2="589" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="1048.0" y="589" width="44" height="44" rx="10" fill="#15803d14" stroke="#15803d" stroke-width="1.6"/><text x="1070.0" y="616.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">W</text><line x1="1100" y1="558" x2="1070" y2="589" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="1108.0" y="589" width="44" height="44" rx="10" fill="#15803d14" stroke="#15803d" stroke-width="1.6"/><text x="1130.0" y="616.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">W</text><line x1="1100" y1="558" x2="1130" y2="589" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><text x="1035" y="661" font-size="12" fill="#334155" text-anchor="middle">supervisors of supervisors</text></g></svg>