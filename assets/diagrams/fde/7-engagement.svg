<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="400" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">An FDE engagement, in five phases</text><text x="24" y="56" font-size="13" fill="#475569">Our synthesis of posting texts and public descriptions; lengths vary from weeks to months</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="fd" style="animation-delay:0.0s"><rect x="24" y="100" width="210" height="130" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="129.0" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Discover</text><text x="129.0" y="142" text-anchor="middle" font-size="12" fill="#334155">sit with users</text><text x="129.0" y="158" text-anchor="middle" font-size="12" fill="#334155">find the real problem</text><text x="129.0" y="174" text-anchor="middle" font-size="12" fill="#334155">agree a success metric</text></g><line x1="234" y1="165" x2="258" y2="165" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.2s"><rect x="258" y="100" width="210" height="130" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="363.0" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Prototype</text><text x="363.0" y="142" text-anchor="middle" font-size="12" fill="#334155">build on real data fast</text><text x="363.0" y="158" text-anchor="middle" font-size="12" fill="#334155">demo to users</text><text x="363.0" y="174" text-anchor="middle" font-size="12" fill="#334155">cut scope</text></g><line x1="468" y1="165" x2="492" y2="165" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.4s"><rect x="492" y="100" width="210" height="130" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="597.0" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Productionise</text><text x="597.0" y="142" text-anchor="middle" font-size="12" fill="#334155">security, evals, monitoring</text><text x="597.0" y="158" text-anchor="middle" font-size="12" fill="#334155">fit the customer’s systems</text><text x="597.0" y="174" text-anchor="middle" font-size="12" fill="#334155">handle edge cases</text></g><line x1="702" y1="165" x2="726" y2="165" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.6000000000000001s"><rect x="726" y="100" width="210" height="130" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="831.0" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Prove &amp; expand</text><text x="831.0" y="142" text-anchor="middle" font-size="12" fill="#334155">measure against the metric</text><text x="831.0" y="158" text-anchor="middle" font-size="12" fill="#334155">win the next use case</text></g><line x1="936" y1="165" x2="960" y2="165" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.8s"><rect x="960" y="100" width="210" height="130" rx="10" fill="#be123c14" stroke="#be123c" stroke-width="1.6"/><text x="1065.0" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Hand over</text><text x="1065.0" y="142" text-anchor="middle" font-size="12" fill="#334155">train the customer team</text><text x="1065.0" y="158" text-anchor="middle" font-size="12" fill="#334155">feed lessons to product</text><text x="1065.0" y="174" text-anchor="middle" font-size="12" fill="#334155">move to next customer</text></g><path class="dr" d="M1110,232 C1110,330 130,330 130,232" fill="none" stroke="#15803d" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="600" y="348" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">What they learn in the field goes back into the product (the “margin for moat” bet)</text></svg>