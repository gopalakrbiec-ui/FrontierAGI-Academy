<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1100" height="420" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Entry points into the role</text><text x="24" y="56" font-size="13" fill="#475569">Open roles by level, read from job titles (our grouping)</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><text x="24" y="114" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">Intern</text><rect class="gr" style="animation-delay:0.0s" x="330" y="96" width="65.3" height="28" rx="6" fill="#15803d"/><text x="403.28" y="116" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700"></text><text x="24" y="168" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">New grad</text><rect class="gr" style="animation-delay:0.15s" x="330" y="150" width="76.2" height="28" rx="6" fill="#15803d"/><text x="414.15999999999997" y="170" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700"></text><text x="24" y="222" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">Core</text><rect class="gr" style="animation-delay:0.3s" x="330" y="204" width="680.0" height="28" rx="6" fill="#475569"/><text x="1018.0" y="224" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700"></text><text x="24" y="276" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">Senior</text><rect class="gr" style="animation-delay:0.44999999999999996s" x="330" y="258" width="402.6" height="28" rx="6" fill="#475569"/><text x="740.56" y="278" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700"></text><text x="24" y="330" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">Manager</text><rect class="gr" style="animation-delay:0.6s" x="330" y="312" width="163.2" height="28" rx="6" fill="#475569"/><text x="501.2" y="332" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700"></text><text x="24" y="404" font-size="11.5" fill="#64748b" text-anchor="start">Source: our snapshot of 255 forward deployed postings on 10 companies’ own job boards, 2026-11-27 (data/fde-postings.json).</text></svg>