<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="360" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">A 24-week FDE curriculum</text><text x="24" y="56" font-size="13" fill="#475569">Four phases; about 70% build and 30% deliver; a capstone ends each block (our curriculum, structure adapted from formal programmes)</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect class="gr" style="animation-delay:0.0s" x="40" y="110" width="183" height="70" rx="10" fill="#2563eb22" stroke="#2563eb" stroke-width="1.6"/><text x="133.33333333333331" y="140" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="700">Phase 1: Foundations</text><text x="133.33333333333331" y="162" font-size="12" fill="#334155" text-anchor="middle">weeks 1–4</text><rect class="gr" style="animation-delay:0.2s" x="227" y="110" width="276" height="70" rx="10" fill="#7c3aed22" stroke="#7c3aed" stroke-width="1.6"/><text x="366.6666666666667" y="140" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="700">Phase 2: Core build</text><text x="366.6666666666667" y="162" font-size="12" fill="#334155" text-anchor="middle">weeks 5–10</text><rect class="gr" style="animation-delay:0.4s" x="507" y="110" width="369" height="70" rx="10" fill="#0d948822" stroke="#0d9488" stroke-width="1.6"/><text x="693.3333333333334" y="140" font-size="15" fill="#0d9488" text-anchor="middle" font-weight="700">Phase 3: Production</text><text x="693.3333333333334" y="162" font-size="12" fill="#334155" text-anchor="middle">weeks 11–18</text><rect class="gr" style="animation-delay:0.6000000000000001s" x="880" y="110" width="276" height="70" rx="10" fill="#be123c22" stroke="#be123c" stroke-width="1.6"/><text x="1020.0" y="140" font-size="15" fill="#be123c" text-anchor="middle" font-weight="700">Phase 4: Mastery</text><text x="1020.0" y="162" font-size="12" fill="#334155" text-anchor="middle">weeks 19–24</text><text x="63.33333333333333" y="100" font-size="10.5" fill="#94a3b8" text-anchor="middle">1</text><text x="109.99999999999999" y="100" font-size="10.5" fill="#94a3b8" text-anchor="middle">2</text><text x="156.66666666666666" y="100" font-size="10.5" fill="#94a3b8" text-anchor="middle">3</text><text x="203.33333333333334" y="100" font-size="10.5" fill="#94a3b8" text-anchor="middle">4</text><text x="250.0" y="100" font-size="10.5" fill="#94a3b8" text-anchor="middle">5</text><text x="296.6666666666667" y="100" font-size="10.5" fill="#94a3b8" text-anchor="middle">6</text><text x="343.3333333333333" y="100" font-size="10.5" fill="#94a3b8" text-anchor="middle">7</text><text x="390.0" y="100" font-size="10.5" fill="#94a3b8" text-anchor="middle">8</text><text x="436.66666666666663" y="100" font-size="10.5" fill="#94a3b8" text-anchor="middle">9</text><text x="483.3333333333333" y="100" font-size="10.5" fill="#94a3b8" text-anchor="middle">10</text><text x="530.0" y="100" font-size="10.5" fill="#94a3b8" text-anchor="middle">11</text><text x="576.6666666666666" y="100" font-size="10.5" fill="#94a3b8" text-anchor="middle">12</text><text x="623.3333333333334" y="100" font-size="10.5" fill="#94a3b8" text-anchor="middle">13</text><text x="670.0" y="100" font-size="10.5" fill="#94a3b8" text-anchor="middle">14</text><text x="716.6666666666667" y="100" font-size="10.5" fill="#94a3b8" text-anchor="middle">15</text><text x="763.3333333333334" y="100" font-size="10.5" fill="#94a3b8" text-anchor="middle">16</text><text x="810.0" y="100" font-size="10.5" fill="#94a3b8" text-anchor="middle">17</text><text x="856.6666666666667" y="100" font-size="10.5" fill="#94a3b8" text-anchor="middle">18</text><text x="903.3333333333334" y="100" font-size="10.5" fill="#94a3b8" text-anchor="middle">19</text><text x="950.0" y="100" font-size="10.5" fill="#94a3b8" text-anchor="middle">20</text><text x="996.6666666666667" y="100" font-size="10.5" fill="#94a3b8" text-anchor="middle">21</text><text x="1043.3333333333333" y="100" font-size="10.5" fill="#94a3b8" text-anchor="middle">22</text><text x="1089.9999999999998" y="100" font-size="10.5" fill="#94a3b8" text-anchor="middle">23</text><text x="1136.6666666666667" y="100" font-size="10.5" fill="#94a3b8" text-anchor="middle">24</text><g class="fd" style="animation-delay:0.8s"><line x1="216.66666666666666" y1="182" x2="216.66666666666666" y2="206" stroke="#d97706" stroke-width="1.5"/><circle cx="216.66666666666666" cy="182" r="6" fill="#d97706"/><text x="216.66666666666666" y="220" font-size="12.5" fill="#b45309" text-anchor="middle" font-weight="700">★ Capstone 1</text><text x="216.66666666666666" y="236" font-size="11.5" fill="#334155" text-anchor="middle">first working tool</text></g><g class="fd" style="animation-delay:0.9500000000000001s"><line x1="496.6666666666667" y1="182" x2="496.6666666666667" y2="258" stroke="#d97706" stroke-width="1.5"/><circle cx="496.6666666666667" cy="182" r="6" fill="#d97706"/><text x="496.6666666666667" y="272" font-size="12.5" fill="#b45309" text-anchor="middle" font-weight="700">★ Capstone 2</text><text x="496.6666666666667" y="288" font-size="11.5" fill="#334155" text-anchor="middle">RAG on messy docs</text></g><g class="fd" style="animation-delay:1.1s"><line x1="730.0" y1="182" x2="730.0" y2="206" stroke="#d97706" stroke-width="1.5"/><circle cx="730.0" cy="182" r="6" fill="#d97706"/><text x="730.0" y="220" font-size="12.5" fill="#b45309" text-anchor="middle" font-weight="700">★ Capstone 3</text><text x="730.0" y="236" font-size="11.5" fill="#334155" text-anchor="middle">regulated rebuild</text></g><g class="fd" style="animation-delay:1.25s"><line x1="823.3333333333334" y1="182" x2="823.3333333333334" y2="258" stroke="#d97706" stroke-width="1.5"/><circle cx="823.3333333333334" cy="182" r="6" fill="#d97706"/><text x="823.3333333333334" y="272" font-size="12.5" fill="#b45309" text-anchor="middle" font-weight="700">★ Capstone 4</text><text x="823.3333333333334" y="288" font-size="11.5" fill="#334155" text-anchor="middle">security audit</text></g><g class="fd" style="animation-delay:1.4s"><line x1="1110" y1="182" x2="1110" y2="206" stroke="#d97706" stroke-width="1.5"/><circle cx="1110" cy="182" r="6" fill="#d97706"/><text x="1110" y="220" font-size="12.5" fill="#b45309" text-anchor="middle" font-weight="700">★ Final</text><text x="1110" y="236" font-size="11.5" fill="#334155" text-anchor="middle">industry deployment</text></g><text x="24" y="344" font-size="11.5" fill="#64748b" text-anchor="start">About 6 hours a week, ~145 hours in total. Modules link to this site’s articles; see Part 4 of The Forward Deployed Engineer.</text></svg>