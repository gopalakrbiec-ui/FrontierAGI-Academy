<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="420" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Paths into forward deployed engineering</text><text x="24" y="56" font-size="13" fill="#475569">Where FDEs come from, and the gap each path has to close (our reading of posting requirements)</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="24" y="76" width="380" height="48" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="214.0" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Software engineer</text><text x="214.0" y="118" text-anchor="middle" font-size="12" fill="#334155">gap: customer skills, travel, scoping</text><line x1="404" y1="100" x2="760" y2="210" stroke="#2563eb" stroke-width="1.7" marker-end="url(#a)"/><rect x="24" y="132" width="380" height="48" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="214.0" y="154" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Solutions / sales engineer</text><text x="214.0" y="174" text-anchor="middle" font-size="12" fill="#334155">gap: production-grade building</text><line x1="404" y1="156" x2="760" y2="210" stroke="#7c3aed" stroke-width="1.7" marker-end="url(#a)"/><rect x="24" y="188" width="380" height="48" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="214.0" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Consultant</text><text x="214.0" y="230" text-anchor="middle" font-size="12" fill="#334155">gap: shipping code yourself</text><line x1="404" y1="212" x2="760" y2="210" stroke="#d97706" stroke-width="1.7" marker-end="url(#a)"/><rect x="24" y="244" width="380" height="48" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="214.0" y="266" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Data / ML engineer</text><text x="214.0" y="286" text-anchor="middle" font-size="12" fill="#334155">gap: full-stack apps, customer work</text><line x1="404" y1="268" x2="760" y2="210" stroke="#0d9488" stroke-width="1.7" marker-end="url(#a)"/><rect x="24" y="300" width="380" height="48" rx="10" fill="#be123c14" stroke="#be123c" stroke-width="1.6"/><text x="214.0" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Founder</text><text x="214.0" y="342" text-anchor="middle" font-size="12" fill="#334155">gap: working inside a big customer</text><line x1="404" y1="324" x2="760" y2="210" stroke="#be123c" stroke-width="1.7" marker-end="url(#a)"/><rect x="24" y="356" width="380" height="48" rx="10" fill="#15803d14" stroke="#15803d" stroke-width="1.6"/><text x="214.0" y="378" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">New graduate</text><text x="214.0" y="398" text-anchor="middle" font-size="12" fill="#334155">gap: Palantir / Databricks programmes</text><line x1="404" y1="380" x2="760" y2="210" stroke="#15803d" stroke-width="1.7" marker-end="url(#a)"/><rect x="760" y="160" width="320" height="100" rx="10" fill="#0f172a14" stroke="#0f172a" stroke-width="1.6"/><text x="920.0" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Forward deployed engineer</text><text x="920.0" y="202" text-anchor="middle" font-size="12" fill="#334155">median 6 years asked</text><text x="920.0" y="218" text-anchor="middle" font-size="12" fill="#334155">79% mention customers</text></svg>