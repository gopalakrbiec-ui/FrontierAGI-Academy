<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="300" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Five capstones, each harder than the last</text><text x="24" y="56" font-size="13" fill="#475569">Each adds one thing real customers demand (our design)</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="fd" style="animation-delay:0.0s"><rect x="24" y="100" width="212" height="110" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="130.0" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">1. First tool</text><text x="130.0" y="142" text-anchor="middle" font-size="12" fill="#334155">tested, containerised,</text><text x="130.0" y="158" text-anchor="middle" font-size="12" fill="#334155">one-pager</text></g><line x1="236" y1="155" x2="258" y2="155" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.2s"><rect x="258" y="100" width="212" height="110" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="364.0" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">2. RAG + evals</text><text x="364.0" y="142" text-anchor="middle" font-size="12" fill="#334155">messy docs, eval set,</text><text x="364.0" y="158" text-anchor="middle" font-size="12" fill="#334155">write-up</text></g><line x1="470" y1="155" x2="492" y2="155" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.4s"><rect x="492" y="100" width="212" height="110" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="598.0" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">3. Regulated rebuild</text><text x="598.0" y="142" text-anchor="middle" font-size="12" fill="#334155">bank or hospital rules, risk</text><text x="598.0" y="158" text-anchor="middle" font-size="12" fill="#334155">register</text></g><line x1="704" y1="155" x2="726" y2="155" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.6000000000000001s"><rect x="726" y="100" width="212" height="110" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="832.0" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">4. Security audit</text><text x="832.0" y="142" text-anchor="middle" font-size="12" fill="#334155">threats, fixes, governance</text><text x="832.0" y="158" text-anchor="middle" font-size="12" fill="#334155">plan</text></g><line x1="938" y1="155" x2="960" y2="155" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.8s"><rect x="960" y="100" width="212" height="110" rx="10" fill="#be123c14" stroke="#be123c" stroke-width="1.6"/><text x="1066.0" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">5. Industry deployment</text><text x="1066.0" y="142" text-anchor="middle" font-size="12" fill="#334155">prototype → hardened → demo</text><text x="1066.0" y="158" text-anchor="middle" font-size="12" fill="#334155">defended live</text></g><text x="130" y="240" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">+ ships</text><text x="364" y="240" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">+ measured quality</text><text x="598" y="240" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">+ compliance</text><text x="832" y="240" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">+ security</text><text x="1066" y="240" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">+ a customer</text></svg>