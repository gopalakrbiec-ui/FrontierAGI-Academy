<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="420" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">The computer-use loop</text><text x="24" y="56" font-size="13" fill="#475569">Every computer-use agent repeats the same four steps until the task is done or it stops</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="fd" style="animation-delay:0.0s"><rect x="40" y="110" width="240" height="110" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="160.0" y="132" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Look</text><text x="160.0" y="152" text-anchor="middle" font-size="12" fill="#334155">screenshot, page tree</text><text x="160.0" y="168" text-anchor="middle" font-size="12" fill="#334155">or code output</text></g><line x1="280" y1="165" x2="330" y2="165" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.2s"><rect x="330" y="110" width="240" height="110" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="450.0" y="132" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Decide</text><text x="450.0" y="152" text-anchor="middle" font-size="12" fill="#334155">model picks the</text><text x="450.0" y="168" text-anchor="middle" font-size="12" fill="#334155">next action(s)</text></g><line x1="570" y1="165" x2="620" y2="165" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.4s"><rect x="620" y="110" width="240" height="110" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="740.0" y="132" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Act</text><text x="740.0" y="152" text-anchor="middle" font-size="12" fill="#334155">click, type, scroll,</text><text x="740.0" y="168" text-anchor="middle" font-size="12" fill="#334155">navigate, run code</text></g><line x1="860" y1="165" x2="910" y2="165" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.6000000000000001s"><rect x="910" y="110" width="240" height="110" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="1030.0" y="132" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Check</text><text x="1030.0" y="152" text-anchor="middle" font-size="12" fill="#334155">did it work?</text><text x="1030.0" y="168" text-anchor="middle" font-size="12" fill="#334155">new screenshot</text></g><path d="M1040,222 C1040,330 160,330 160,222" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="600" y="318" font-size="13.5" fill="#334155" text-anchor="middle" font-weight="700">repeat: often 10–100+ steps for one task</text><rect x="380" y="340" width="440" height="46" rx="10" fill="#be123c14" stroke="#be123c" stroke-width="1.6"/><text x="600.0" y="368.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Stop: done, stuck, or a human must confirm</text></svg>