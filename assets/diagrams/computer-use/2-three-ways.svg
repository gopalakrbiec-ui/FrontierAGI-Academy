<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="470" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Three ways an agent “sees” software</text><text x="24" y="56" font-size="13" fill="#475569">Pixels work everywhere; structure and code are cheaper and more reliable where they exist (our comparison)</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="fd" style="animation-delay:0.0s"><rect x="30" y="80" width="360" height="350" rx="14" fill="#2563eb10" stroke="#2563eb" stroke-width="1.8"/><text x="210" y="112" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="700">Pixels (screenshots)</text><text x="54" y="156" font-size="14" fill="#0f172a" text-anchor="start">• screenshot → x,y click</text><text x="54" y="198" font-size="14" fill="#0f172a" text-anchor="start">• any app, any OS</text><text x="54" y="240" font-size="14" fill="#0f172a" text-anchor="start">• costly images each step</text><text x="54" y="282" font-size="14" fill="#0f172a" text-anchor="start">• fragile on tiny text</text><text x="54" y="324" font-size="12.5" fill="#475569" text-anchor="start">e.g. Claude computer use,</text><text x="54" y="366" font-size="12.5" fill="#475569" text-anchor="start">Gemini computer use</text></g><g class="fd" style="animation-delay:0.2s"><rect x="420" y="80" width="360" height="350" rx="14" fill="#0d948810" stroke="#0d9488" stroke-width="1.8"/><text x="600" y="112" font-size="16" fill="#0d9488" text-anchor="middle" font-weight="700">Structure (accessibility tree / DOM)</text><text x="444" y="156" font-size="14" fill="#0f172a" text-anchor="start">• read elements by role and name</text><text x="444" y="198" font-size="14" fill="#0f172a" text-anchor="start">• web pages and some apps</text><text x="444" y="240" font-size="14" fill="#0f172a" text-anchor="start">• cheap text, exact targets</text><text x="444" y="282" font-size="14" fill="#0f172a" text-anchor="start">• misses canvas and visuals</text><text x="444" y="324" font-size="12.5" fill="#475569" text-anchor="start">e.g. Playwright MCP, Claude</text><text x="444" y="366" font-size="12.5" fill="#475569" text-anchor="start">browser use (also screenshots)</text></g><g class="fd" style="animation-delay:0.4s"><rect x="810" y="80" width="360" height="350" rx="14" fill="#d9770610" stroke="#d97706" stroke-width="1.8"/><text x="990" y="112" font-size="16" fill="#d97706" text-anchor="middle" font-weight="700">Code (scripted actions)</text><text x="834" y="156" font-size="14" fill="#0f172a" text-anchor="start">• model writes Playwright / Python</text><text x="834" y="198" font-size="14" fill="#0f172a" text-anchor="start">• loops over many fields at once</text><text x="834" y="240" font-size="14" fill="#0f172a" text-anchor="start">• fewest model calls</text><text x="834" y="282" font-size="14" fill="#0f172a" text-anchor="start">• needs a runtime and sandbox</text><text x="834" y="324" font-size="12.5" fill="#475569" text-anchor="start">e.g. OpenAI CUA sample app,</text><text x="834" y="366" font-size="12.5" fill="#475569" text-anchor="start">browser-use library</text></g></svg>