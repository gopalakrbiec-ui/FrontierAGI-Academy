<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="500" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Defences for an agent that clicks</text><text x="24" y="56" font-size="13" fill="#475569">Layered: no single layer stops prompt injection (our checklist, based on the labs’ safety guidance)</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="fd" style="animation-delay:0.0s"><rect x="60" y="76" width="1080" height="56" rx="10" fill="#2563eb12" stroke="#2563eb" stroke-width="1.6"/><text x="84" y="101" font-size="15" fill="#2563eb" text-anchor="start" font-weight="700">Isolated VM or browser profile</text><text x="84" y="121" font-size="12.5" fill="#334155" text-anchor="start">no personal logins, minimal rights</text></g><g class="fd" style="animation-delay:0.12s"><rect x="90" y="144" width="1020" height="56" rx="10" fill="#0d948812" stroke="#0d9488" stroke-width="1.6"/><text x="114" y="169" font-size="15" fill="#0d9488" text-anchor="start" font-weight="700">Domain allow-list</text><text x="114" y="189" font-size="12.5" fill="#334155" text-anchor="start">only the sites the task needs</text></g><g class="fd" style="animation-delay:0.24s"><rect x="120" y="212" width="960" height="56" rx="10" fill="#7c3aed12" stroke="#7c3aed" stroke-width="1.6"/><text x="144" y="237" font-size="15" fill="#7c3aed" text-anchor="start" font-weight="700">Injection screening</text><text x="144" y="257" font-size="12.5" fill="#334155" text-anchor="start">classifiers on screenshots and pages</text></g><g class="fd" style="animation-delay:0.36s"><rect x="150" y="280" width="900" height="56" rx="10" fill="#d9770612" stroke="#d97706" stroke-width="1.6"/><text x="174" y="305" font-size="15" fill="#d97706" text-anchor="start" font-weight="700">Human confirmation</text><text x="174" y="325" font-size="12.5" fill="#334155" text-anchor="start">payments, sending, deleting, accepting terms</text></g><g class="fd" style="animation-delay:0.48s"><rect x="180" y="348" width="840" height="56" rx="10" fill="#be123c12" stroke="#be123c" stroke-width="1.6"/><text x="204" y="373" font-size="15" fill="#be123c" text-anchor="start" font-weight="700">Step, time and cost limits</text><text x="204" y="393" font-size="12.5" fill="#334155" text-anchor="start">stop runaway loops</text></g><g class="fd" style="animation-delay:0.6s"><rect x="210" y="416" width="780" height="56" rx="10" fill="#47556912" stroke="#475569" stroke-width="1.6"/><text x="234" y="441" font-size="15" fill="#475569" text-anchor="start" font-weight="700">Recording and review</text><text x="234" y="461" font-size="12.5" fill="#334155" text-anchor="start">screenshots + actions kept for audit</text></g></svg>