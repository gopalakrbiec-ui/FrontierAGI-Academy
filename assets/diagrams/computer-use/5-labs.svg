<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="470" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">How the three big labs ship computer use</text><text x="24" y="56" font-size="13" fill="#475569">From each lab’s own docs or sample repo (read 28 Nov 2026); our summary</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="fd" style="animation-delay:0.0s"><rect x="30" y="80" width="360" height="350" rx="14" fill="#b4532a10" stroke="#b4532a" stroke-width="1.8"/><text x="210" y="114" font-size="18" fill="#b4532a" text-anchor="middle" font-weight="700">Anthropic</text><text x="56" y="164" font-size="14" fill="#0f172a" text-anchor="start">• computer toolset: 17 actions</text><text x="56" y="214" font-size="14" fill="#0f172a" text-anchor="start">• browser toolset: 27 (+4 optional)</text><text x="56" y="264" font-size="14" fill="#0f172a" text-anchor="start">• you run the VM or browser</text><text x="56" y="314" font-size="14" fill="#0f172a" text-anchor="start">• injection classifiers on screenshots</text><text x="56" y="364" font-size="14" fill="#0f172a" text-anchor="start">• Claude in Chrome (product)</text></g><g class="fd" style="animation-delay:0.2s"><rect x="420" y="80" width="360" height="350" rx="14" fill="#10a37f10" stroke="#10a37f" stroke-width="1.8"/><text x="600" y="114" font-size="18" fill="#10a37f" text-anchor="middle" font-weight="700">OpenAI</text><text x="446" y="164" font-size="14" fill="#0f172a" text-anchor="start">• model writes code to act</text><text x="446" y="214" font-size="14" fill="#0f172a" text-anchor="start">• Playwright or PyAutoGUI runtime</text><text x="446" y="264" font-size="14" fill="#0f172a" text-anchor="start">• ComputerToolset in the SDK</text><text x="446" y="314" font-size="14" fill="#0f172a" text-anchor="start">• Agents API with computer use</text><text x="446" y="364" font-size="14" fill="#0f172a" text-anchor="start">• ChatGPT agent, Atlas (products)</text></g><g class="fd" style="animation-delay:0.4s"><rect x="810" y="80" width="360" height="350" rx="14" fill="#2563eb10" stroke="#2563eb" stroke-width="1.8"/><text x="990" y="114" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="700">Google</text><text x="836" y="164" font-size="14" fill="#0f172a" text-anchor="start">• Gemini computer use model</text><text x="836" y="214" font-size="14" fill="#0f172a" text-anchor="start">• Playwright or Browserbase env</text><text x="836" y="264" font-size="14" fill="#0f172a" text-anchor="start">• browser-first sample agent</text><text x="836" y="314" font-size="14" fill="#0f172a" text-anchor="start">• Vertex AI or Gemini API</text><text x="836" y="364" font-size="14" fill="#0f172a" text-anchor="start">• Mariner, Antigravity (products)</text></g></svg>